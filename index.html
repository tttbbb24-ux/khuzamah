<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="خزامى">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#531989">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>خزامى</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Ruwudu:wght@700&display=swap">
<style>
/* Layout: one phone screen — status strip, 3-column seat board, waiting-orders list; every task opens as a full sheet. */
:root{
  --bg:#f5f2f9; --surface:#ffffff; --ink:#1d1426; --muted:#685d75; --line:#ddd5e8;
  --accent:#531989; --accent-ink:#ffffff;
  --busy:#531989; --busy-ink:#ffffff; --busy-muted:#d9c8ee;
  --red:#c02a2a; --red-bg:#fbe3e1; --green:#17713f; --green-bg:#dcf2e5;
  --warn:#8f5200; --warn-bg:#fdebc8; --alarm:#b3261e; --shade:rgba(10,20,18,.55);
  --display:"Noto Naskh Arabic",Tahoma,serif;
  --body:"Noto Naskh Arabic","Segoe UI",Tahoma,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#120b1a; --surface:#1e1429; --ink:#efe9f6; --muted:#a698b8; --line:#33264a;
  --accent:#b88cf2; --accent-ink:#1a0b2b;
  --busy:#5e2496; --busy-ink:#ffffff; --busy-muted:#d9c8ee;
  --red:#ff8077; --red-bg:#3b1a18; --green:#62d498; --green-bg:#14301f;
  --warn:#f3b556; --warn-bg:#3a2a0e; --shade:rgba(0,0,0,.65); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#120b1a; --surface:#1e1429; --ink:#efe9f6; --muted:#a698b8; --line:#33264a;
  --accent:#b88cf2; --accent-ink:#1a0b2b;
  --busy:#5e2496; --busy-ink:#ffffff; --busy-muted:#d9c8ee;
  --red:#ff8077; --red-bg:#3b1a18; --green:#62d498; --green-bg:#14301f;
  --warn:#f3b556; --warn-bg:#3a2a0e; --shade:rgba(0,0,0,.65); color-scheme:dark }

*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;direction:rtl}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin-inline:auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:0;flex:1;min-width:0}
.ghost{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;min-height:46px}

.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:500;font-size:15px}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strip div{border-block-start:3px solid var(--line);padding-block-start:8px;min-width:0}
.strip b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.strip span{font-size:13px;color:var(--muted)}
.strip .alert{border-color:var(--red)} .strip .alert b{color:var(--red)}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr;max-width:460px;width:100%;margin-inline:auto}
.seat{direction:rtl}
.seat{position:relative;display:flex;flex-direction:column;gap:2px;min-height:112px;padding:10px;border-radius:14px;
  border:1.5px dashed var(--line);background:transparent;min-width:0}
.seat .n{font-family:var(--display);font-size:34px;line-height:1}
.seat .st{font-size:13px;color:var(--muted)}
.seat.on{border:1.5px solid var(--busy);background:var(--busy);color:var(--busy-ink)}
.seat.on .st{color:var(--busy-muted)}
.seat.on .tm{font-weight:600;font-size:15px}
.seat.on .tt{font-size:13px;color:var(--busy-muted)}
.seat.over{border-color:var(--warn)} .seat.over .tm{color:#ffc56b}
.seat.alarm{background:var(--alarm);border-color:var(--alarm);color:#fff}
.seat.alarm .st,.seat.alarm .tt{color:#ffe3df}
.seat.alarm .dot{background:#fff;color:var(--alarm)}
.seat.add{align-items:center;justify-content:center;border-style:solid;text-align:center}
.seat.add .n{color:var(--accent)}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seat .dot{position:absolute;inset-block-start:8px;inset-inline-end:8px;background:#d43a35;color:#fff;border-radius:999px;
  min-width:26px;height:26px;padding-inline:7px;display:grid;place-items:center;font-weight:700;font-size:14px}

.logo{width:46px;height:46px;border-radius:12px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.cats{grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;min-width:0;min-height:108px;
  padding:10px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.tile .pic{font-size:34px;line-height:1.15}
.tile b{font-size:14px;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.tile .num{font-size:13px;font-weight:700;color:var(--accent)}
.tile:active{transform:scale(.97)}
.tile.cat{min-height:124px;background:var(--busy);border-color:var(--busy);color:var(--busy-ink)}
.tile.cat .pic{font-size:42px} .tile.cat b{font-size:16px} .tile.cat .num{color:var(--busy-muted);font-weight:500}
.tile.paint,.menu .xopt.paint{color:#fff;border-color:transparent;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.tile.paint .num{color:#fff}
.crumb{display:flex;align-items:center;gap:10px} .crumb b{font-size:17px}
.menu .xopt .pic{font-size:30px;line-height:1.1}
.menu .xopt.paint{position:relative;min-height:84px;opacity:.78}
.menu .xopt.paint.on{opacity:1;outline:4px solid var(--ink);outline-offset:2px}
.menu .xopt.paint.on::after{content:"✓";position:absolute;inset-block-start:6px;inset-inline-start:8px;background:#fff;color:#111;border-radius:999px;width:24px;height:24px;display:grid;place-items:center;font-weight:700;text-shadow:none}
h2{font-size:17px;font-weight:700;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
h3.cat.st{font-size:16px;color:var(--ink);margin-block-start:8px;display:flex;justify-content:space-between}
h3.cat.st.hot{color:var(--red);border-color:var(--red)}
h3.cat{font-size:14px;font-weight:600;margin:0;color:var(--muted);border-block-end:1.5px solid var(--line);padding-block-end:4px}
select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px;min-height:48px;min-width:0}
.set .row.item{flex-wrap:wrap;padding-block-end:8px;border-block-end:1px solid var(--line)}
.set .row.item .nm{flex:1 1 150px}
.set .row.item select{flex:1 1 130px}
.wait{display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--red-bg);border-radius:12px;padding:8px 10px 8px 8px}
.wrow .who{font-family:var(--display);font-size:24px;line-height:1;color:var(--red);min-width:34px;text-align:center}
.wrow .what{flex:1;min-width:0;font-weight:600}
.wrow .what small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.done{background:var(--green);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;min-height:46px}
:root[data-theme="dark"] .done{color:#06200f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .done{color:#06200f}}
.empty{color:var(--muted);font-size:15px;margin:0}

.sheet{position:fixed;inset:0;z-index:10;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:100%;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:16px;padding-block-end:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.phead{display:flex;align-items:center;gap:12px}
.phead .big{font-family:var(--display);font-size:44px;line-height:1}
.phead .meta{flex:1;min-width:0}
.phead .meta b{display:block;font-size:17px}
.phead .meta span{color:var(--muted);font-size:14px}
.close{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-width:46px;min-height:46px;font-size:22px;text-align:center}

.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px 12px;text-align:center}
.pick b{display:block;font-size:20px}
.pick span{font-family:var(--display);font-size:30px;color:var(--accent);line-height:1.2}

.orders{display:flex;flex-direction:column;gap:8px}
.ord{display:flex;gap:8px;align-items:stretch}
.ord .tog{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;min-height:54px;border:2px solid}
.ord .tog .nm{flex:1;min-width:0;font-weight:600}
.ord .tog .nm small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.menu .xopt{align-items:center;text-align:center}
.menu .xopt.on,.menu .xopt.on span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.menu .xopt.paint span,.menu .xopt.paint.on span{background:none;color:#fff}
.ord .tog .tag{font-weight:700;font-size:14px;white-space:nowrap}
.ord.p .tog{background:var(--red-bg);border-color:var(--red)} .ord.p .tag{color:var(--red)}
.ord.s .tog{background:var(--green-bg);border-color:var(--green)} .ord.s .tag{color:var(--green)}
.ord .del{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-width:50px;padding-inline:8px;font-size:14px;font-weight:600;color:var(--muted);text-align:center}
.ord .del.qb{font-size:22px;min-width:46px;padding-inline:4px;color:var(--ink)}
.ord .del.qb.sure{font-size:14px}
.xq{color:var(--accent);font-weight:700;white-space:nowrap}
.wrow .xq{color:var(--red)}
.ord .del.sure{background:var(--red);border-color:var(--red);color:#fff}

.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.menu{grid-template-columns:repeat(3,1fr)}}
.menu button{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:60px;
  display:flex;flex-direction:column;justify-content:center;min-width:0}
.menu button b{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.menu button span{color:var(--accent);font-weight:700;font-size:14px}
.menu button:active{border-color:var(--accent)}

.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-block-start:1.5px solid var(--line);padding-block-start:14px}
.foot .sum{flex:1;min-width:0}
.foot .sum span{display:block;color:var(--muted);font-size:13px}
.foot .sum b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px 20px;font-weight:700;font-size:17px;min-height:54px;text-align:center}
.wide{width:100%}
.link{color:var(--muted);text-decoration:underline;font-size:14px;padding:10px 4px;min-height:44px}
.link.sure{color:var(--red);font-weight:700}

.bill{background:var(--surface);border-radius:14px;padding:6px 14px}
.bill .r{display:flex;gap:10px;padding-block:9px;border-block-end:1px solid var(--line)}
.bill .r:last-child{border:0}
.bill .r span:first-child{flex:1;min-width:0}
.bill .r.tot{font-weight:700;font-size:19px}
.bill .r .q{color:var(--muted)}
.bill button.r{font:inherit;color:inherit;text-align:inherit}
.bill .r.sub{color:var(--muted);font-size:15px;padding-inline-start:14px}
.step{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.step button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-width:50px;min-height:50px;font-size:24px;text-align:center}
.step.qstep{justify-content:center}
.step .chip{font-size:15px;min-width:0;padding:10px 14px}
.pbox{border:1.5px dashed var(--line);border-radius:12px;padding:8px 10px}
.step b{font-family:var(--display);font-weight:400;font-size:30px;min-width:28px;text-align:center}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;min-height:46px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.set{display:flex;flex-direction:column;gap:8px}
.set .row{display:flex;gap:8px;align-items:center}
.set label{font-size:14px;color:var(--muted);flex:1;min-width:0}
input{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;min-width:0;width:100%}
.set .row input.nm{flex:1} .set .row input.pr{flex:0 0 84px;width:84px;text-align:center}

.toast{position:fixed;inset-inline:16px;inset-block-end:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-weight:600;text-align:center;max-width:520px;margin-inline:auto}
@media (prefers-reduced-motion:no-preference){ .panel{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }

/* ---- v20: شريط سفلي، تبويبات الجلسة، ألوان الحالات، خط الأرقام ---- */
:root{--num:"Noto Naskh Arabic","Segoe UI",Tahoma,serif;--st-open:#531989;--st-hour:#b895ea;--st-free:#85808f;--st-conv:#b85a08;--st-take:#22304f}
.wrap{padding-block-end:104px}
.wrap section{display:flex;flex-direction:column;gap:18px}
.ghost.bell{position:relative;min-width:44px;min-height:40px;padding:8px;display:grid;place-items:center}
.ghost.bell svg{width:22px;height:22px}
.ghost.bell .bdg{position:absolute;inset-block-start:-6px;inset-inline-start:-6px;min-width:20px;height:20px;padding-inline:5px;border-radius:999px;background:#d43a35;color:#fff;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center}
.ghost.who{font-size:14px;padding:8px 12px;min-height:40px;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{position:fixed;inset-inline:0;inset-block-end:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-block-start:1.5px solid var(--line);padding-block-end:env(safe-area-inset-bottom,0px)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;padding:8px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--accent)}
.nav button.on::before{content:"";position:absolute;inset-block-start:-1.5px;inset-inline:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav svg{width:24px;height:24px}
.nav .bdg{position:absolute;inset-block-start:5px;inset-inline-start:calc(50% + 4px);min-width:20px;height:20px;padding-inline:5px;border-radius:999px;background:#d43a35;color:#fff;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center}
.toast{inset-block-end:calc(84px + env(safe-area-inset-bottom,0px))}
.strip b,.seat .n,.seat .tm,.wrow .who,.phead .big,.pick span,.foot .sum b,.step b,.tabb .num{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}
.strip b{font-size:27px} .seat .n{font-size:28px} .phead .big{font-size:38px} .pick span{font-size:27px} .foot .sum b{font-size:29px} .wrow .who{font-size:21px} .step b{font-size:26px}
.bill .r>.num:last-child{font-weight:600}
.seat.on{border-color:transparent;color:#fff}
.seat.on .st,.seat.on .tt{color:rgba(255,255,255,.84)}
.seat.on .tm{font-size:23px;line-height:1.15}
.seat.st-open{background:var(--st-open)} .seat.st-free{background:var(--st-free)} .seat.st-conv{background:var(--st-conv)} .seat.st-take{background:var(--st-take)}
.seat.st-hour{background:var(--st-hour);color:#1d1426} .seat.st-hour .st,.seat.st-hour .tt{color:#3d2c5a}
.seat.alarm{background:var(--alarm);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:0 0 0 1.5px var(--muted)}
.tile.cat{border-color:transparent} .tile.cat .num{color:inherit;opacity:.85}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px}
.tabb{min-height:46px;border-radius:10px;font-weight:700;text-align:center;color:var(--muted)}
.tabb.on{background:var(--accent);color:var(--accent-ink)}
.stickyfoot{position:sticky;inset-block-end:0;z-index:2;background:var(--bg);padding-block-end:calc(14px + env(safe-area-inset-bottom,0px))}
.panel:has(>.stickyfoot){padding-block-end:0}
.panel>*{flex-shrink:0}
.more{display:flex;flex-direction:column;gap:8px}
.more button{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;min-height:56px;font-weight:600}
.more button span{color:var(--muted);font-weight:400;font-size:14px}
.gate{position:fixed;inset:0;z-index:30;background:#531989;color:#fff;display:grid;place-items:center;padding:24px;overflow-y:auto}
.gate form{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:320px}
.glogo{width:170px;height:170px;border-radius:32px}
.gsub{margin:0;font-size:16px;color:#e6d9f5}
.gate input{background:#fff;color:#1d1426;border:0;text-align:center;font-size:26px;letter-spacing:.2em;min-height:60px;border-radius:14px}
.gate #gate-msg{margin:0;min-height:22px;color:#ffd0cb;font-weight:600}
.gate #gate-btn{width:100%;min-height:56px;border-radius:14px;background:#fff;color:#531989;font-weight:700;font-size:18px;text-align:center}
.flash{position:fixed;inset:0;z-index:25;margin:auto;width:120px;height:120px;border-radius:50%;background:var(--green);color:#fff;font-size:64px;display:grid;place-items:center;pointer-events:none}
button:active{transform:scale(.97)}
@media (prefers-reduced-motion:no-preference){
  .flash{animation:flash .75s ease-out both} @keyframes flash{0%{transform:scale(.5);opacity:0}25%{transform:scale(1.05);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
  .toast{animation:tin .2s ease-out} @keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .wrow.pop{animation:wdrop .45s ease-out;position:relative;overflow:hidden} @keyframes wdrop{0%{transform:translateY(-20px);opacity:0}100%{transform:none;opacity:1}}
  .wrow.pop::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);animation:wshine .9s .3s ease-out both;pointer-events:none} @keyframes wshine{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
  .wrow.late{animation:lglow 1.4s ease-in-out infinite} @keyframes lglow{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 45%,transparent),0 0 18px color-mix(in srgb,var(--red) 40%,transparent)}}
  .wrow.late small{animation:lred 1.4s ease-in-out infinite} @keyframes lred{50%{color:#ff4d40}}
  button{transition:transform .08s}
}
.fcancel{flex-basis:100%;order:3;min-height:36px;padding:2px 4px;text-align:center;font-size:13px}
.nx{flex:none;width:36px;height:36px;border-radius:50%;color:var(--muted);font-size:15px}
.gate{background:radial-gradient(120% 80% at 80% 0%,#8a3fd1 0%,transparent 60%),radial-gradient(100% 70% at 0% 100%,#b65ad6 0%,transparent 55%),linear-gradient(160deg,#3a0f66,#531989 55%,#2a0a4d);overflow:hidden auto}
