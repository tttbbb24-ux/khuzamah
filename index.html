<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="خزامى">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#531989">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>خزامى</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone screen — status strip, 3-column seat board, waiting-orders list; every task opens as a full sheet. */
:root{
  --bg:#f5f2f9; --surface:#ffffff; --ink:#1d1426; --muted:#685d75; --line:#ddd5e8;
  --accent:#531989; --accent-ink:#ffffff;
  --busy:#531989; --busy-ink:#ffffff; --busy-muted:#d9c8ee;
  --red:#c02a2a; --red-bg:#fbe3e1; --green:#17713f; --green-bg:#dcf2e5;
  --warn:#8f5200; --warn-bg:#fdebc8; --alarm:#b3261e; --shade:rgba(10,20,18,.55);
  --display:"Lalezar","Readex Pro",Tahoma,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#120b1a; --surface:#1e1429; --ink:#efe9f6; --muted:#a698b8; --line:#33264a;
  --accent:#b88cf2; --accent-ink:#1a0b2b;
  --busy:#5e2496; --busy-ink:#ffffff; --busy-muted:#d9c8ee;
  --red:#ff8077; --red-bg:#3b1a18; --green:#62d498; --green-bg:#14301f;
  --warn:#f3b556; --warn-bg:#3a2a0e; --shade:rgba(0,0,0,.65); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#120b1a; --surface:#1e1429; --ink:#efe9f6; --muted:#a698b8; --line:#33264a;
  --accent:#b88cf2; --accent-ink:#1a0b2b;
  --busy:#5e2496; --busy-ink:#ffffff; --busy-muted:#d9c8ee;
  --red:#ff8077; --red-bg:#3b1a18; --green:#62d498; --green-bg:#14301f;
  --warn:#f3b556; --warn-bg:#3a2a0e; --shade:rgba(0,0,0,.65); color-scheme:dark }

*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;direction:rtl}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin-inline:auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:0;flex:1;min-width:0}
.ghost{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;min-height:46px}

.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:500;font-size:15px}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strip div{border-block-start:3px solid var(--line);padding-block-start:8px;min-width:0}
.strip b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.strip span{font-size:13px;color:var(--muted)}
.strip .alert{border-color:var(--red)} .strip .alert b{color:var(--red)}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr;max-width:460px;width:100%;margin-inline:auto}
.seat{direction:rtl}
.seat{position:relative;display:flex;flex-direction:column;gap:2px;min-height:112px;padding:10px;border-radius:14px;
  border:1.5px dashed var(--line);background:transparent;min-width:0}
.seat .n{font-family:var(--display);font-size:34px;line-height:1}
.seat .st{font-size:13px;color:var(--muted)}
.seat.on{border:1.5px solid var(--busy);background:var(--busy);color:var(--busy-ink)}
.seat.on .st{color:var(--busy-muted)}
.seat.on .tm{font-weight:600;font-size:15px}
.seat.on .tt{font-size:13px;color:var(--busy-muted)}
.seat.over{border-color:var(--warn)} .seat.over .tm{color:#ffc56b}
.seat.alarm{background:var(--alarm);border-color:var(--alarm);color:#fff}
.seat.alarm .st,.seat.alarm .tt{color:#ffe3df}
.seat.alarm .dot{background:#fff;color:var(--alarm)}
.seat.add{align-items:center;justify-content:center;border-style:solid;text-align:center}
.seat.add .n{color:var(--accent)}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seat .dot{position:absolute;inset-block-start:8px;inset-inline-end:8px;background:#d43a35;color:#fff;border-radius:999px;
  min-width:26px;height:26px;padding-inline:7px;display:grid;place-items:center;font-weight:700;font-size:14px}

.logo{width:46px;height:46px;border-radius:12px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.cats{grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;min-width:0;min-height:108px;
  padding:10px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.tile .pic{font-size:34px;line-height:1.15}
.tile b{font-size:14px;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.tile .num{font-size:13px;font-weight:700;color:var(--accent)}
.tile:active{transform:scale(.97)}
.tile.cat{min-height:124px;background:var(--busy);border-color:var(--busy);color:var(--busy-ink)}
.tile.cat .pic{font-size:42px} .tile.cat b{font-size:16px} .tile.cat .num{color:var(--busy-muted);font-weight:500}
.tile.paint,.menu .xopt.paint{color:#fff;border-color:transparent;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.tile.paint .num{color:#fff}
.crumb{display:flex;align-items:center;gap:10px} .crumb b{font-size:17px}
.menu .xopt .pic{font-size:30px;line-height:1.1}
.menu .xopt.paint{position:relative;min-height:84px;opacity:.78}
.menu .xopt.paint.on{opacity:1;outline:4px solid var(--ink);outline-offset:2px}
.menu .xopt.paint.on::after{content:"✓";position:absolute;inset-block-start:6px;inset-inline-start:8px;background:#fff;color:#111;border-radius:999px;width:24px;height:24px;display:grid;place-items:center;font-weight:700;text-shadow:none}
h2{font-size:17px;font-weight:700;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
h3.cat.st{font-size:16px;color:var(--ink);margin-block-start:8px;display:flex;justify-content:space-between}
h3.cat.st.hot{color:var(--red);border-color:var(--red)}
h3.cat{font-size:14px;font-weight:600;margin:0;color:var(--muted);border-block-end:1.5px solid var(--line);padding-block-end:4px}
select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px;min-height:48px;min-width:0}
.set .row.item{flex-wrap:wrap;padding-block-end:8px;border-block-end:1px solid var(--line)}
.set .row.item .nm{flex:1 1 150px}
.set .row.item select{flex:1 1 130px}
.wait{display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--red-bg);border-radius:12px;padding:8px 10px 8px 8px}
.wrow .who{font-family:var(--display);font-size:24px;line-height:1;color:var(--red);min-width:34px;text-align:center}
.wrow .what{flex:1;min-width:0;font-weight:600}
.wrow .what small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.done{background:var(--green);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;min-height:46px}
:root[data-theme="dark"] .done{color:#06200f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .done{color:#06200f}}
.empty{color:var(--muted);font-size:15px;margin:0}

.sheet{position:fixed;inset:0;z-index:10;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:100%;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:16px;padding-block-end:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.phead{display:flex;align-items:center;gap:12px}
.phead .big{font-family:var(--display);font-size:44px;line-height:1}
.phead .meta{flex:1;min-width:0}
.phead .meta b{display:block;font-size:17px}
.phead .meta span{color:var(--muted);font-size:14px}
.close{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-width:46px;min-height:46px;font-size:22px;text-align:center}

.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px 12px;text-align:center}
.pick b{display:block;font-size:20px}
.pick span{font-family:var(--display);font-size:30px;color:var(--accent);line-height:1.2}

.orders{display:flex;flex-direction:column;gap:8px}
.ord{display:flex;gap:8px;align-items:stretch}
.ord .tog{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;min-height:54px;border:2px solid}
.ord .tog .nm{flex:1;min-width:0;font-weight:600}
.ord .tog .nm small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.menu .xopt{align-items:center;text-align:center}
.menu .xopt.on,.menu .xopt.on span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.menu .xopt.paint span,.menu .xopt.paint.on span{background:none;color:#fff}
.ord .tog .tag{font-weight:700;font-size:14px;white-space:nowrap}
.ord.p .tog{background:var(--red-bg);border-color:var(--red)} .ord.p .tag{color:var(--red)}
.ord.s .tog{background:var(--green-bg);border-color:var(--green)} .ord.s .tag{color:var(--green)}
.ord .del{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-width:50px;padding-inline:8px;font-size:14px;font-weight:600;color:var(--muted);text-align:center}
.ord .del.qb{font-size:22px;min-width:46px;padding-inline:4px;color:var(--ink)}
.ord .del.qb.sure{font-size:14px}
.xq{color:var(--accent);font-weight:700;white-space:nowrap}
.wrow .xq{color:var(--red)}
.ord .del.sure{background:var(--red);border-color:var(--red);color:#fff}

.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.menu{grid-template-columns:repeat(3,1fr)}}
.menu button{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:60px;
  display:flex;flex-direction:column;justify-content:center;min-width:0}
.menu button b{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.menu button span{color:var(--accent);font-weight:700;font-size:14px}
.menu button:active{border-color:var(--accent)}

.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-block-start:1.5px solid var(--line);padding-block-start:14px}
.foot .sum{flex:1;min-width:0}
.foot .sum span{display:block;color:var(--muted);font-size:13px}
.foot .sum b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px 20px;font-weight:700;font-size:17px;min-height:54px;text-align:center}
.wide{width:100%}
.link{color:var(--muted);text-decoration:underline;font-size:14px;padding:10px 4px;min-height:44px}
.link.sure{color:var(--red);font-weight:700}

.bill{background:var(--surface);border-radius:14px;padding:6px 14px}
.bill .r{display:flex;gap:10px;padding-block:9px;border-block-end:1px solid var(--line)}
.bill .r:last-child{border:0}
.bill .r span:first-child{flex:1;min-width:0}
.bill .r.tot{font-weight:700;font-size:19px}
.bill .r .q{color:var(--muted)}
.bill button.r{font:inherit;color:inherit;text-align:inherit}
.bill .r.sub{color:var(--muted);font-size:15px;padding-inline-start:14px}
.step{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.step button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-width:50px;min-height:50px;font-size:24px;text-align:center}
.step.qstep{justify-content:center}
.step .chip{font-size:15px;min-width:0;padding:10px 14px}
.pbox{border:1.5px dashed var(--line);border-radius:12px;padding:8px 10px}
.step b{font-family:var(--display);font-weight:400;font-size:30px;min-width:28px;text-align:center}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;min-height:46px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.set{display:flex;flex-direction:column;gap:8px}
.set .row{display:flex;gap:8px;align-items:center}
.set label{font-size:14px;color:var(--muted);flex:1;min-width:0}
input{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;min-width:0;width:100%}
.set .row input.nm{flex:1} .set .row input.pr{flex:0 0 84px;width:84px;text-align:center}

.toast{position:fixed;inset-inline:16px;inset-block-end:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-weight:600;text-align:center;max-width:520px;margin-inline:auto}
@media (prefers-reduced-motion:no-preference){ .panel{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }

/* ---- v20: شريط سفلي، تبويبات الجلسة، ألوان الحالات، خط الأرقام ---- */
:root{--num:"Readex Pro","Segoe UI",Tahoma,sans-serif;--st-open:#531989;--st-hour:#b895ea;--st-free:#85808f;--st-conv:#b85a08;--st-take:#22304f}
.wrap{padding-block-end:104px}
.wrap section{display:flex;flex-direction:column;gap:18px}
.ghost.bell{position:relative;min-width:44px;min-height:40px;padding:8px;display:grid;place-items:center}
.ghost.bell svg{width:22px;height:22px}
.ghost.bell .bdg{position:absolute;inset-block-start:-6px;inset-inline-start:-6px;min-width:20px;height:20px;padding-inline:5px;border-radius:999px;background:#d43a35;color:#fff;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center}
.ghost.who{font-size:14px;padding:8px 12px;min-height:40px;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{position:fixed;inset-inline:0;inset-block-end:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-block-start:1.5px solid var(--line);padding-block-end:env(safe-area-inset-bottom,0px)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;padding:8px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--accent)}
.nav button.on::before{content:"";position:absolute;inset-block-start:-1.5px;inset-inline:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav svg{width:24px;height:24px}
.nav .bdg{position:absolute;inset-block-start:5px;inset-inline-start:calc(50% + 4px);min-width:20px;height:20px;padding-inline:5px;border-radius:999px;background:#d43a35;color:#fff;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center}
.toast{inset-block-end:calc(84px + env(safe-area-inset-bottom,0px))}
.strip b,.seat .n,.seat .tm,.wrow .who,.phead .big,.pick span,.foot .sum b,.step b,.tabb .num{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}
.strip b{font-size:27px} .seat .n{font-size:28px} .phead .big{font-size:38px} .pick span{font-size:27px} .foot .sum b{font-size:29px} .wrow .who{font-size:21px} .step b{font-size:26px}
.bill .r>.num:last-child{font-weight:600}
.seat.on{border-color:transparent;color:#fff}
.seat.on .st,.seat.on .tt{color:rgba(255,255,255,.84)}
.seat.on .tm{font-size:23px;line-height:1.15}
.seat.st-open{background:var(--st-open)} .seat.st-free{background:var(--st-free)} .seat.st-conv{background:var(--st-conv)} .seat.st-take{background:var(--st-take)}
.seat.st-hour{background:var(--st-hour);color:#1d1426} .seat.st-hour .st,.seat.st-hour .tt{color:#3d2c5a}
.seat.alarm{background:var(--alarm);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:0 0 0 1.5px var(--muted)}
.tile.cat{border-color:transparent} .tile.cat .num{color:inherit;opacity:.85}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px}
.tabb{min-height:46px;border-radius:10px;font-weight:700;text-align:center;color:var(--muted)}
.tabb.on{background:var(--accent);color:var(--accent-ink)}
.stickyfoot{position:sticky;inset-block-end:0;z-index:2;background:var(--bg);margin-block-end:calc(-20px - env(safe-area-inset-bottom,0px));padding-block-end:calc(14px + env(safe-area-inset-bottom,0px))}
.more{display:flex;flex-direction:column;gap:8px}
.more button{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;min-height:56px;font-weight:600}
.more button span{color:var(--muted);font-weight:400;font-size:14px}
.gate{position:fixed;inset:0;z-index:30;background:#531989;color:#fff;display:grid;place-items:center;padding:24px;overflow-y:auto}
.gate form{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:320px}
.glogo{width:170px;height:170px;border-radius:32px}
.gsub{margin:0;font-size:16px;color:#e6d9f5}
.gate input{background:#fff;color:#1d1426;border:0;text-align:center;font-size:26px;letter-spacing:.2em;min-height:60px;border-radius:14px}
.gate #gate-msg{margin:0;min-height:22px;color:#ffd0cb;font-weight:600}
.gate #gate-btn{width:100%;min-height:56px;border-radius:14px;background:#fff;color:#531989;font-weight:700;font-size:18px;text-align:center}
.flash{position:fixed;inset:0;z-index:25;margin:auto;width:120px;height:120px;border-radius:50%;background:var(--green);color:#fff;font-size:64px;display:grid;place-items:center;pointer-events:none}
button:active{transform:scale(.97)}
@media (prefers-reduced-motion:no-preference){
  .flash{animation:flash .75s ease-out both} @keyframes flash{0%{transform:scale(.5);opacity:0}25%{transform:scale(1.05);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
  .toast{animation:tin .2s ease-out} @keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .wrow.pop{animation:pop .5s ease-out} @keyframes pop{0%{transform:scale(.92);opacity:.3}60%{transform:scale(1.02)}100%{transform:none;opacity:1}}
  button{transition:transform .08s}
}
.fcancel{flex-basis:100%;order:3;min-height:36px;padding:2px 4px;text-align:center;font-size:13px}
.nx{flex:none;width:36px;height:36px;border-radius:50%;color:var(--muted);font-size:15px}
.gate{background:radial-gradient(120% 80% at 80% 0%,#8a3fd1 0%,transparent 60%),radial-gradient(100% 70% at 0% 100%,#b65ad6 0%,transparent 55%),linear-gradient(160deg,#3a0f66,#531989 55%,#2a0a4d);overflow:hidden auto}
.gate::before,.gate::after{content:"";position:absolute;border-radius:50%;filter:blur(50px);opacity:.45;pointer-events:none}
.gate::before{width:260px;height:260px;background:#c9a2ff;inset-block-start:-70px;inset-inline-start:-80px}
.gate::after{width:300px;height:300px;background:#ff8fd0;inset-block-end:-110px;inset-inline-end:-100px;opacity:.28}
.gate form{position:relative;z-index:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:28px;padding:28px 22px 24px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(20,0,45,.45)}

  .splash img{animation:spIn .7s cubic-bezier(.2,1.4,.4,1) both,spGlow 1.6s .7s ease-out infinite}

  @keyframes spIn{from{transform:scale(.3) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes spGlow{from{box-shadow:0 0 0 0 rgba(201,162,255,.55),0 18px 44px rgba(20,0,45,.55)}to{box-shadow:0 0 0 34px rgba(201,162,255,0),0 18px 44px rgba(20,0,45,.55)}}
  @keyframes spTxt{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  @keyframes spPetal{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-105vh) rotate(260deg);opacity:0}}
  @keyframes gFloat{50%{transform:translateY(-7px)}}
}

<script>
const DEFAULTS = { hour:15, open:30, count:15, items:[
  {name:"معسل تفاحتين",price:30},{name:"معسل عنب توت",price:30},{name:"معسل عنب نعناع",price:30},
  {name:"ميني بانكيك",price:10},{name:"موهيتو سفن",price:10},{name:"موهيتو كودرد",price:12},
  {name:"كودرد",price:7},{name:"قهوة اليوم حار",price:7},{name:"قهوة اليوم بارد",price:7},{name:"موية",price:1}
]};
const EXTRAS=["كتشب","شطة","كوكتيل","حمر","ثوم","كمون","ملح","فلفل أسود"];
const FLAV=["فراولة","حبحب","توت أزرق"];
const CORN={small:5,big:10}, CODERED={plain:6,flav:12}, REDBULL={plain:15,flav:20};
const RX={fries:/بطاطس/,corn:/ذر[ةه]/,dog:/كورن/,cr:/كود\s*ري?د/,moj:/موهيتو/,pan:/بان\s*كيك/,rb:/ريد\s*بول/};
const CATS=[["corn","كورن دوق وذرة"],["fries","البطاطس"],["cold","المشروبات الباردة"],["hot","المشروبات الحارة"],["hookah","المعسلات"],["sweet","الحلا"],["nuts","المكسرات"],["other","أخرى"]];
function catOf(name){ // تخمين القسم من الاسم، للأصناف اللي ما لها قسم محفوظ
  const n=String(name);
  if(RX.corn.test(n)||RX.dog.test(n)) return "corn";
  if(RX.fries.test(n)) return "fries";
  if(/معسل/.test(n)) return "hookah";
  if(/كيك|كوكيز|حلا|وافل|كريب/.test(n)) return "sweet";
  if(/^مكسرات/.test(n)) return "nuts";
  if(/حار|شاهي|دل[ةه]|كرك/.test(n)) return "hot";
  if(/بارد|موهيتو|مو[يى][ةه]|سفن|بيبسي|عصير/.test(n)||RX.cr.test(n)||RX.rb.test(n)) return "cold";
  return "other";
}
const CAT_ICON={corn:"🌽",fries:"🍟",cold:"🧊",hot:"☕",hookah:"💨",sweet:"🍰",nuts:"🥜",other:"🍽️"};
const RED="#c81e2f";
const OPT_LOOK={"فراولة":["🍓","#d62839"],"حبحب":["🍉","linear-gradient(135deg,#2e9e4f 50%,#e23d50 50%)"],"توت أزرق":["🫐","#3f51b5"],"شوكولاتة":["🍫","#5a3420"],"لوتس":["🍪","#b96f24"]};
function icon(name){ const n=String(name);
  if(RX.dog.test(n)) return "🌭"; if(RX.corn.test(n)) return "🌽"; if(RX.fries.test(n)) return "🍟";
  if(/معسل/.test(n)) return /تفاح/.test(n)?"🍎":/نعناع/.test(n)?"🌿":"🍇";
  if(RX.moj.test(n)) return "🍹"; if(RX.cr.test(n)) return "🥤"; if(RX.rb.test(n)) return "⚡"; if(/مو[يى][ةه]/.test(n)) return "💧";
  if(RX.pan.test(n)) return "🥞"; if(/كوكيز/.test(n)) return "🍪"; if(/كيك/.test(n)) return "🍰"; if(/مكسرات/.test(n)) return "🥜";
  if(/دل[ةه]/.test(n)) return "🫖"; if(/شاهي/.test(n)) return "🍵"; if(/بارد/.test(n)) return "🧋"; if(/قهوة|v\s*60|حار/i.test(n)) return "☕";
  return "🍽️"; }
function hookahBg(name){ const n=String(name); if(!/معسل/.test(n)) return "";
  if(/تفاح/.test(n)) return `linear-gradient(135deg,${RED} 50%,#2e9e4f 50%)`;
  if(/نعناع/.test(n)) return `linear-gradient(135deg,${RED} 50%,#38bdf8 50%)`;
  return RED; }
function menuHtml(){ // الأقسام أول، وبعد الضغط أصناف القسم
  const by=k=>cfg.items.map((it,i)=>[it,i]).filter(([it])=>itemCat(it)===k&&mine(it.name));
  const live=CATS.filter(c=>by(c[0]).length);
  if(!live.length) return `<p class="empty">ما في أصناف لقسمك في القائمة.</p>`;
  if(live.length===1) view.cat=live[0][0];
  if(!view.cat||!by(view.cat).length)
    return `<div class="tiles cats">${CATS.map(([k,t])=>{const n=by(k).length; return n?`<button class="tile cat" style="background:${CAT_LOOK[k][0]};color:${CAT_LOOK[k][1]}" data-act="cat" data-c="${k}"><span class="pic">${CAT_ICON[k]}</span><b>${t}</b><span class="num">${n} صنف</span></button>`:""}).join("")}</div>`;
  return `<div class="crumb">${live.length>1?`<button class="ghost" data-act="cat" data-c="">رجوع للأقسام</button>`:""}<b>${CATS.find(c=>c[0]===view.cat)[1]}</b></div>
  <div class="tiles">${by(view.cat).map(([it,i])=>{const hb=hookahBg(it.name);
    return `<button class="tile ${hb?"paint":""}" ${hb?`style="background:${hb}"`:""} data-act="add" data-i="${i}"><span class="pic">${icon(it.name)}</span><b>${esc(it.name)}</b><span class="num">${menuPrice(it)}</span></button>`}).join("")}</div>`;
}
const itemCat=it=>CATS.some(c=>c[0]===it.cat)?it.cat:catOf(it.name);
function specFor(name){ // الأصناف اللي لها اختيارات، حسب الاسم
  const n=String(name);
  if(RX.fries.test(n)) return {k:"fries",title:"اختر الصوصات والإضافات",opts:EXTRAS,all:true};
  if(RX.corn.test(n)) return {k:"corn",title:"سادة، أو كريمة وشيتوس",excl:"سادة",opts:["كريمة","شيتوس"]};
  if(RX.moj.test(n)) return {k:"moj",title:"اختر النكهة",opts:FLAV};
  if(RX.cr.test(n)) return {k:"cr",title:"بنكهة أو بدون",excl:"بدون نكهة",opts:FLAV};
  if(RX.rb.test(n)) return {k:"rb",title:"بنكهة أو بدون",excl:"بدون نكهة",opts:FLAV};
  if(RX.pan.test(n)) return {k:"pan",title:"اختر الإضافة",excl:"بدون إضافة",opts:["شوكولاتة","لوتس"]};
  return null;
}
function resolve(spec,it,v){ // يحوّل الاختيار إلى اسم وسعر وملاحظة
  const on=spec.opts.filter((_,i)=>v.sel.includes(i)), and=on.join(" و"), base={name:it.name,price:Number(it.price),note:"",ok:true};
  if(spec.k==="fries") return {...base,note:extrasNote(v.sel)};
  if(spec.k==="corn"){
    if(v.ex) return {name:"ذرة سادة"+(v.size?" "+(v.size==="small"?"صغير":"كبير"):""),price:v.size?CORN[v.size]:0,note:"",ok:!!v.size};
    return {name:"ذرة "+and+" كبير",price:CORN.big,note:"",ok:on.length>0};
  }
  if(spec.k==="cr"||spec.k==="rb"){ const P=spec.k==="cr"?CODERED:REDBULL;
    return v.ex?{...base,price:P.plain,note:"بدون نكهة"}:{...base,name:it.name+" بنكهة",price:P.flav,note:and,ok:on.length>0}; }
  if(spec.k==="moj") return {...base,note:and,ok:on.length>0};
  if(spec.k==="pan") return v.ex?{...base,note:"بدون إضافة"}:{...base,note:and,ok:on.length>0};
  return base;
}
function menuPrice(it){
  const sp=specFor(it.name);
  if(sp&&sp.k==="corn") return CORN.small+" أو "+CORN.big+" ريال";
  if(sp&&sp.k==="cr") return CODERED.plain+" أو "+CODERED.flav+" ريال";
  if(sp&&sp.k==="rb") return REDBULL.plain+" أو "+REDBULL.flav+" ريال";
  return Number(it.price)+" ريال";
}
function extrasNote(sel){
  const on=EXTRAS.filter((_,i)=>sel.includes(i)), off=EXTRAS.filter((_,i)=>!sel.includes(i));
  if(!on.length) return "بدون إضافات";
  if(!off.length) return "كل شي";
  if(off.length<=2&&on.length>off.length) return "كل شي ما عدا "+off.join(" و");
  return on.join("، ");
}
const GRACE = 15; // ربع ساعة سماح، بعدها جلسة الساعة تتحول وقت مفتوح

let db=null, ready=false, cfg=DEFAULTS, seats={}, orders=[], sales=[];
let view=null, draft=null, sure=null, sureTimer=null;
const flying=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sid=n=>"s"+String(n).padStart(2,"0");
const seatNo=id=>parseInt(id.slice(1),10);
const money=n=>(Math.round(n*100)/100)+" ريال";
const mins=t=>Math.max(0,Math.floor((Date.now()-t)/60000));
const clock=m=>Math.floor(m/60)+":"+String(m%60).padStart(2,"0");
function dayKey(ts){const d=new Date(ts-6*3600e3);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const TODAY=dayKey(Date.now());
const dayShift=(k,n)=>{const [y,m,d]=k.split("-").map(Number), t=new Date(y,m-1,d+n); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const dayLabel=k=>{const [y,m,d]=k.split("-").map(Number); try{return new Date(y,m-1,d).toLocaleDateString("ar-u-ca-gregory-nu-latn",{weekday:"long",day:"numeric",month:"numeric"})}catch(e){return k}};
const seatOrders=id=>{const s=seats[id];return s?orders.filter(o=>o.seat===id&&o.sid===s.sid).sort((a,b)=>a.at-b.at):[]};
const isTake=id=>id[0]==="t";
const lab=id=>isTake(id)?String((seats[id]&&seats[id].tno)||"سفري"):String(seatNo(id));
const tclock=t=>{const d=new Date(t||0);return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")};
const bookedH=s=>Math.max(1,Number(s.hours)||1);
const left=s=>bookedH(s)*60-mins(s.startedAt); // الدقائق الباقية لجلسة الساعة
const autoHours=s=>s.type==="hour"?bookedH(s):1;
const billMode=(s,v)=>s.type==="take"?"take":(v&&v.mode)||(s.type==="open"?"open":s.type==="free"?"free":mins(s.startedAt)>bookedH(s)*60+GRACE?"open":"hour"); // كيف تنحسب الجلسة
const MODE={hour:"ساعة",open:"وقت مفتوح",free:"مجاناً"};
const mine=name=>P()||(!!me&&stationOf(name)===me.station); // هل الصنف من صلاحية هذا المستخدم

function fee(id,v){
  const s=seats[id]; if(!s||s.type==="take") return 0;
  const m=billMode(s,v);
  return m==="free"?0:m==="open"?cfg.open:((v&&v.hours)||autoHours(s))*cfg.hour;
}
const qty=o=>Math.max(1,Math.round(Number(o.qty)||1));
const r2=n=>Math.round(n*100)/100;
const itemsTotal=id=>seatOrders(id).reduce((a,o)=>a+Number(o.price||0)*qty(o),0);
const sameLine=(a,b)=>a.seat===b.seat&&a.sid===b.sid&&a.name===b.name&&Number(a.price)===Number(b.price)&&(a.note||"")===(b.note||"")&&!!a.served===!!b.served;
function groupOrders(list){ // يجمع الأسطر المتطابقة في سطر واحد بكمية
  const out=[]; list.forEach(o=>{const g=out.find(x=>sameLine(x.o,o)); if(g){g.docs.push(o);g.q+=qty(o)} else out.push({o,docs:[o],q:qty(o)})}); return out; }
const units=list=>list.reduce((a,o)=>a+qty(o),0);
function bump(o,n){ // يغيّر كمية سطر محفوظ
  return db.doc("orders/"+o.id).update({qty:o.qty==null?1+n:firebase.firestore.FieldValue.increment(n)}); }

function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200)}
function fail(e){
  const c=e&&e.code;
  toast(c==="permission-denied"?"ما عندك صلاحية تعديل على هذي الصفحة":
        c==="quota_exceeded"?"المساحة امتلأت، احذفوا بيانات قديمة":"ما تسجل، حاول مرة ثانية");
}
async function run(key,fn){
  if(!db){toast("الصفحة مو متصلة");return}
  if(flying.has(key)) return; flying.add(key);
  try{await fn()}catch(e){fail(e)}finally{flying.delete(key)}
}
function arm(key){ // ضغطتين للتأكيد
  if(sure===key){sure=null;clearTimeout(sureTimer);return true}
  sure=key;clearTimeout(sureTimer);sureTimer=setTimeout(()=>{sure=null;renderSheet()},3500);renderSheet();return false;
}

/* ---------- الرئيسية ---------- */
const LAYOUT=[5,6,15,4,7,14,3,8,13,2,9,12,1,10,11]; // ترتيب الجلسات على الأرض، صف صف من اليسار
function allSeatIds(){ // null = خانة فاضية تحفظ مكانها في الشبكة
  const live=n=>n<=cfg.count||seats[sid(n)];
  const ids=LAYOUT.map(n=>live(n)?sid(n):null);
  const extra=new Set();
  for(let i=16;i<=cfg.count;i++)extra.add(sid(i));
  Object.keys(seats).forEach(k=>{if(seatNo(k)>15)extra.add(k)});
  return ids.concat([...extra].sort());
}
const STATIONS=[["طلبات البطاطس",n=>RX.fries.test(n)],["طلبات الكورن دوق والذرة",n=>RX.dog.test(n)||RX.corn.test(n)],["طلبات الترك",()=>true]];
const stationOf=name=>STATIONS.findIndex(x=>x[1](String(name||"")));
let actx=null, muted=false, prevPend=null, timesSeeded=false; const alerted=new Set();
try{muted=localStorage.getItem("kz-mute")==="1"}catch(e){}
document.addEventListener("click",()=>{ // المتصفح ما يسمح بالصوت إلا بعد أول ضغطة
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); else if(actx.state==="suspended") actx.resume(); }catch(e){} },true);
function beep(tones){
  if(muted) return;
  try{ if(navigator.vibrate) navigator.vibrate(tones.flatMap(()=>[180,120])) }catch(e){}
  if(!actx) return;
  try{ let t=actx.currentTime;

function openSummary(day){ openSheet({kind:"summary",day,week:view&&view.kind==="summary"?view.week:null}); loadDay(view); }
async function loadDay(v){ // يجيب بيانات اليوم المعروض
  if(!db||!P()) return;
  try{
    if(v.day!==TODAY){ const [a,l]=await Promise.all([db.collection("sales").where("day","==",v.day).get(), db.collection("log").where("day","==",v.day).get()]);
      v.sales=a.docs.map(d=>Object.assign({id:d.id},d.data())); v.logs=l.docs.map(d=>d.data()); }
    const c=await db.doc("closings/"+v.day).get(); v.closing=c.exists?c.data():null;
    if(!v.week){ const w=await db.collection("sales").where("day",">=",dayShift(TODAY,-6)).get(), m={};
      w.docs.forEach(d=>{const x=d.data(); if(x.pay!=="comp") m[x.day]=(m[x.day]||0)+Number(x.total||0)}); v.week=m; }
  }catch(e){ if(v.day!==TODAY&&!v.sales) v.sales=[]; }
  if(view===v) renderSheet();
}

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="cl-float"||t.id==="cl-count"){ if(!view||view.kind!=="summary") return; view[t.id==="cl-float"?"float":"count"]=t.value;
    const K=closeCalc(summarize((view.day||TODAY)===TODAY?sales:(view.sales||[]))); $("cl-diff").textContent="المفروض "+money(K.exp)+" · "+diffText(K); return; }
  if(t.id==="x-price"){ if(!view||view.kind!=="extras") return; view.cprice=t.value; $("x-sum").textContent=xSum(pickLine()); return; }
  if(t.id==="pay-disc"||t.id==="pay-cash"){ if(!view||view.kind!=="pay") return; view[t.id==="pay-disc"?"disc":"cash"]=t.value;
    const c=payCalc(view.id,view); $("pay-total").textContent=money(c.total); $("pay-split").disabled=!c.splitOk; $("pay-split").textContent=splitLabel(c); return; }
  if(!draft) return;
  if(t.dataset.f) draft[t.dataset.f]=t.value;
  else if(t.dataset.k) draft.items[+t.dataset.i][t.dataset.k]=t.value;
});

let fdb=null, uid=null;
const MIG=7; let migrating=false;
function migrate(){ // تعديلات قائمة الأصناف، كل خطوة تنفذ مرة وحدة
  const m=cfg.mig||0; if(migrating||m>=MIG) return; migrating=true;
  let items=cfg.items.map(i=>({...i}));
  const put=(rx,name,price)=>{const e=items.find(i=>rx.test(i.name)); if(e) e.price=price; else items.push({name,price})};
  if(m<6){
    items=items.filter(i=>!(RX.moj.test(i.name)&&RX.cr.test(i.name)));
    items.forEach(i=>{if(RX.cr.test(i.name)) i.price=CODERED.plain});
    if(!items.some(i=>RX.corn.test(i.name))) items.push({name:"ذرة",price:CORN.big});
    if(!items.some(i=>RX.dog.test(i.name))) items.push({name:"كورن دوق",price:10});
  }
  if(m<7){
    items=items.filter(i=>!RX.rb.test(i.name)&&!(/كوكيز/.test(i.name)&&!/شوكو?لا|فانيل/.test(i.name)));
    put(/كوكيز.*شوكو?لا/,"كوكيز شوكولاتة",7); put(/كوكيز.*فانيل/,"كوكيز فانيليا",7);
    put(/(v\s*60|في\s*60).*حار/i,"V60 حار",17); put(/(v\s*60|في\s*60).*بارد/i,"V60 بارد",17);
    put(/^مكسرات/,"مكسرات",5); put(/^شاهي/,"شاهي",4); put(/دل[ةه]\s*شاهي/,"دلة شاهي",15);
    items.push({name:"ريد بول",price:REDBULL.plain});
    items.forEach(i=>{if(!i.cat) i.cat=catOf(i.name)});
  }
  db.doc("config/menu").set({hour:cfg.hour,open:cfg.open,count:cfg.count,items,mig:MIG}).catch(()=>{migrating=false});
}
function listen(){
  db=fdb; $("gate").hidden=true; if(!P()){ myStation=me.station; mainTab="orders"; }
  pushSync(false).catch(()=>{});
  db.doc("config/push").onSnapshot(d=>{pushUrl=(d.exists&&d.data().url)||""; if(view&&view.kind==="more"&&document.activeElement!==$("push-url")) renderSheet()},()=>{});
  const quiet=()=>{};
  db.collection("users").onSnapshot(s=>{users={};s.docs.forEach(d=>users[d.id]=d.data());
    if(me&&me.id&&users[me.id]&&!users[me.id].active) return location.reload();
    if(view&&view.kind==="users") refresh(); },quiet);
  if(P()){
    db.collection("codes").onSnapshot(s=>{codeOwners={};s.docs.forEach(d=>codeOwners[d.id]=d.data().user);if(view&&view.kind==="users")refresh()},quiet);
    db.collection("log").where("day","==",TODAY).onSnapshot(s=>{logs=s.docs.map(d=>d.data());if(view&&view.kind==="summary")refresh()},quiet);
  }
  db.doc("config/menu").onSnapshot(d=>{
    const x=d.exists?d.data():null;
    cfg=x&&Array.isArray(x.items)?{hour:Number(x.hour)||DEFAULTS.hour,open:Number(x.open)||DEFAULTS.open,count:Number(x.count)||DEFAULTS.count,items:x.items,mig:Number(x.mig)||0}:DEFAULTS;
    if(!(d.metadata&&d.metadata.fromCache)) migrate();
    refresh();
  },dead);
  db.collection("seats").onSnapshot(s=>{seats={};s.docs.forEach(d=>seats[d.id]=d.data());ready=true;$("notice").hidden=true;checkTimes();refresh()},dead);
  db.collection("orders").onSnapshot(s=>{orders=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(scanOrders(!!(s.metadata&&s.metadata.hasPendingWrites))) beep([880,1175]); refresh()},dead);
  db.collection("sales").where("day","==",TODAY).onSnapshot(s=>{sales=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(view&&view.kind==="summary")renderSheet()},dead);
  setInterval(()=>{ if(dayKey(Date.now())!==TODAY&&!view) return location.reload(); checkTimes(); renderMain(); if(view&&view.kind==="seat"&&!sure) renderSheet()},30000);
}
function gate(msg){ $("gate").hidden=false; $("gate-msg").textContent=msg||""; $("gate-code").value=""; $("gate-code").focus(); }
async function enter(){ // يحدد مين داخل على هذا الجوال
  let a=null; try{a=await fdb.doc("access/"+uid).get()}catch(e){}
  if(a&&a.exists){ const d=a.data();
    if(d.user){ try{const u=await fdb.doc("users/"+d.user).get(); if(u.exists&&u.data().active){me=Object.assign({id:u.id},u.data()); return listen()}}catch(e){}
      return gate("حسابك موقوف أو تغيّر رمزه. اكتب رمزك."); }
    let isReady=true; try{isReady=(await fdb.doc("config/usersReady").get()).exists}catch(e){isReady=true}
    if(!isReady){legacy=true; me={id:"",name:"",role:"partner"}; return listen()}
    return gate("الدخول صار برمز شخصي. اكتب رمزك.");
  }
  gate("");
}
$("gate-form").addEventListener("submit",async e=>{
  e.preventDefault(); const code=digits($("gate-code").value); if(!uid) return;
  if(!/^[0-9]{4,8}$/.test(code)){$("gate-msg").textContent="الرمز أرقام من 4 إلى 8";return}
  $("gate-btn").disabled=true; $("gate-msg").textContent="";
  try{
    let c=null; try{c=await fdb.doc("codes/"+code).get()}catch(e){}
    if(c&&c.exists) await fdb.doc("access/"+uid).set({code,user:c.data().user}); else await fdb.doc("access/"+uid).set({code});
    await enter();
  }catch(err){ $("gate-msg").textContent=err&&err.code==="permission-denied"?"الرمز غلط":"ما قدرنا نتصل، حاول مرة ثانية"; }
  $("gate-btn").disabled=false;
});
const VER="v25";
function checkUpdate(){ // لو الجوال فاتح نسخة قديمة محفوظة، يحمّل الجديدة مباشرة
  fetch(location.pathname+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{
    const m=t.match(/const VER="([^"]+)"/);
    if(m&&m[1]!==VER&&!location.search.includes("v="+m[1])) location.replace(location.pathname+"?v="+m[1]);
  }).catch(()=>{});
}
async function start(){
  renderMain(); checkUpdate();
  try{
    firebase.initializeApp(CFG); fdb=firebase.firestore();
    uid=(await firebase.auth().signInAnonymously()).user.uid;
    await enter();
  }catch(e){ $("notice").textContent="ما قدرنا نتصل. تأكد من الإنترنت وحدّث الصفحة."; }
}
$("ver").textContent=VER; applyTheme();
start();
