<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0217">
<meta name="robots" content="noindex">
<title>خزامى</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:"Readex Pro",Tahoma,sans-serif;color:#fff;background:radial-gradient(ellipse 85% 55% at 50% 40%,#42156c 0%,#34115a 30%,#1c0834 62%,#0b0217 88%,#06000e 100%),#06000e;background-attachment:fixed;
  display:flex;flex-direction:column;align-items:center;gap:18px;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
.logo{width:150px;height:auto;filter:drop-shadow(0 6px 24px rgba(160,100,255,.35))}
.seat{font-family:"Aref Ruqaa","Readex Pro",serif;font-weight:700;font-size:44px;line-height:1.3;background:linear-gradient(180deg,#fbeecb 10%,#e9c77b 50%,#c08a2e 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hint{color:#cdbbe6;font-size:16px;text-align:center}
.btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;margin-block-start:6px}
button{font:inherit;color:#fff;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:14px 18px;border-radius:18px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.24);font-size:20px;font-weight:600;text-align:start;transition:transform .08s,background .15s}
button:active{transform:scale(.97);background:rgba(255,255,255,.16)}
button:disabled{opacity:.45}
button .e{font-size:32px;line-height:1;flex:none}
button:focus-visible{outline:2px solid #e9c77b;outline-offset:2px}
.status{width:100%;max-width:380px;border-radius:18px;padding:18px;text-align:center;font-size:18px;font-weight:600;line-height:1.6;min-height:64px;display:flex;flex-direction:column;justify-content:center}
.status.ok{background:rgba(46,160,90,.18);border:1px solid rgba(90,210,140,.5);color:#bff3d2}
.status.go{background:rgba(233,199,123,.14);border:1px solid rgba(233,199,123,.6);color:#fbeecb}
.status.bad{background:rgba(212,58,53,.16);border:1px solid rgba(240,110,105,.5);color:#ffd0cb}
.status small{display:block;font-weight:400;font-size:14px;opacity:.85}
.foot{margin-block-start:auto;color:#8f7bab;font-size:13px}
@media (prefers-reduced-motion:no-preference){ .status:not([hidden]){animation:in .35s ease-out} @keyframes in{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<img class="logo" src="logo-white.png" alt="خزامى" width="150">
<div class="seat" id="seat"></div>
<p class="hint" id="hint">اضغط اللي تحتاجه ونجيك لين عندك</p>
<div class="btns" id="btns">
  <button data-k="order"><span class="e">🙋</span>أبغى أطلب</button>
  <button data-k="bill"><span class="e">🧾</span>الحساب</button>
  <button data-k="coal"><span class="e">🔥</span>تغيير الفحم</button>
</div>
<div class="status" id="status" role="status" aria-live="polite" hidden></div>
<p class="foot">خزامى · Lavender</p>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
const CFG={apiKey:"AIzaSyDL7CEqeKrh5QRFV1xWVma6AcsX4wsHKVo",authDomain:"khuzama-8a568.firebaseapp.com",projectId:"khuzama-8a568",storageBucket:"khuzama-8a568.firebasestorage.app",messagingSenderId:"153820191466",appId:"1:153820191466:web:2c1afd8b1a9bbf56481593"};
const PUSH="https://khuzamah-push.tttbbb24.workers.dev";
const KIND={order:"تبغى تطلب",bill:"تبغى الحساب",coal:"تبغى تغيير الفحم"};
const WAIT=120000; // نفس مهلة قاعدة البيانات: نداء كل دقيقتين
const $=id=>document.getElementById(id);
const n=parseInt(new URLSearchParams(location.search).get("s"),10), valid=n>=1&&n<=99, sid="s"+String(n).padStart(2,"0");
let db=null, uid="", busy=false, lastAt=0, acked=false;
try{ lastAt=Number(sessionStorage.getItem("kz-call-"+sid))||0 }catch(e){}
function show(cls,html){ const s=$("status"); s.className="status "+cls; s.innerHTML=html; s.hidden=false; }
function lock(on){ document.querySelectorAll("#btns button").forEach(b=>b.disabled=on); }
if(!valid){ $("seat").textContent="خزامى"; $("hint").textContent=""; $("btns").hidden=true; show("bad","الرابط ناقص رقم الجلسة.<small>صوّر الرمز اللي على جلستك مرة ثانية.</small>"); }
else{
  $("seat").textContent="جلسة "+n; document.title="خزامى · جلسة "+n;
  start();
}
async function start(){
  lock(true);
  try{
    firebase.initializeApp(CFG); db=firebase.firestore();
    uid=(await firebase.auth().signInAnonymously()).user.uid;
    lock(false);
    // نتابع النداء: لما الموظف يضغط "رايح لها" يطلع للزبون
    db.doc("calls/"+sid).onSnapshot(d=>{ const x=d.exists?d.data():null;
      if(x&&x.uid===uid&&x.ack&&!acked){ acked=true; show("go",(x.ackName?esc(x.ackName)+" جاي لك الحين":"جايين لك الحين")+" 👋"); }
    },()=>{});
  }catch(e){ show("bad","ما قدرنا نتصل.<small>تأكد من النت وحدّث الصفحة، أو نادِ الموظف.</small>"); }
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("btns").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-k]"); if(!b||busy||!db) return;
  const kind=b.dataset.k, left=WAIT-(Date.now()-lastAt);
  if(left>0&&!acked){ show("ok","نداؤك واصل ✓<small>لحظات ونجيك. لو تأخرنا جرّب بعد "+Math.ceil(left/60000)+" دقيقة.</small>"); return; }
  busy=true; lock(true);
  try{
    await db.doc("calls/"+sid).set({kind,uid,at:firebase.firestore.FieldValue.serverTimestamp()});
    lastAt=Date.now(); acked=false; try{sessionStorage.setItem("kz-call-"+sid,String(lastAt))}catch(e){}
    show("ok","وصل نداؤك ✓<small>عرفنا إنك "+KIND[kind]+"، لحظات ونجيك.</small>");
    // إشعار لجوالات الموظفين حتى لو مقفلة. لو فشل، النداء نفسه واصل للتطبيق.
    try{ await db.doc("callers/"+uid).set({seat:sid}); const token=await firebase.auth().currentUser.getIdToken();
      await fetch(PUSH,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,call:sid})}); }catch(e){}
  }catch(err){
    show("bad",err&&err.code==="permission-denied"
      ?"ما قدرنا نرسل النداء.<small>يمكن جلستك لسا ما انفتحت عندنا، أو أرسلت نداء قبل شوي. نادِ الموظف لو سمحت.</small>"
      :"ما قدرنا نتصل.<small>تأكد من النت وجرّب مرة ثانية.</small>");
  }
  busy=false; lock(false);
});
</script>
</body>
</html>
