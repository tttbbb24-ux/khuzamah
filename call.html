<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120720">
<meta name="robots" content="noindex">
<title>خزامى</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Lalezar&display=swap">
<style>
/* صفحة الزبون: بدون سكرول. شعار فوق، زر الطلب، وأربعة أزرار. المنيو والفاتورة يطلعون من تحت */
:root{--bg:#0c0912;--card:#17121f;--line:#241b30;--ink:#f3eefa;--muted:#9b90ab;--accent:#b88cf2;--acc-ink:#140a22;--green:#62d498;--gold:#e9c77b;--body:"Noto Naskh Arabic",Tahoma,serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;position:relative;overflow:hidden;text-align:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{opacity:.5}
.num{font-variant-numeric:tabular-nums}
.app{position:fixed;inset:0;display:flex;flex-direction:column;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.hero{position:relative;flex:1 1 auto;min-height:170px;overflow:hidden;background:radial-gradient(ellipse 90% 70% at 50% 42%,#4a1a7a 0%,#2a0e4a 38%,#120720 70%,#0c0912 100%)}
.glow{position:absolute;left:50%;top:44%;width:260px;height:260px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#b88cf255,transparent 65%);filter:blur(6px)}
.petals{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.petal{position:absolute;bottom:-20px;width:8px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:linear-gradient(#d8c4ff,#8b5cf6);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-560px) translateX(var(--dx)) rotate(260deg);opacity:0}}
.mid{position:absolute;inset:calc(env(safe-area-inset-top,0px) + 34px) 0 52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:0 14px}
.logo{position:relative;width:min(62%,230px);aspect-ratio:619/513;max-height:56%;filter:drop-shadow(0 0 18px #b88cf2aa);background:url(logo-white.png) center/contain no-repeat}
.shine{position:absolute;inset:0;-webkit-mask:url(logo-white.png) center/contain no-repeat;mask:url(logo-white.png) center/contain no-repeat;background:linear-gradient(110deg,transparent 35%,#fff 48%,#e9d5ff 52%,transparent 65%);background-size:250% 100%;background-position:150% 0;animation:shine 3.6s 1.2s ease-in-out infinite}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.hi{font-size:16px;opacity:.95}.hi b{color:#e3d2ff}
.pills{display:inline-flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.pill{background:#0009;border:1px solid #ffffff2a;border-radius:999px;padding:5px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:5px;color:#fff}
.pill.red b{color:#ffb0a8}
.lang{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px;z-index:3;font-size:13px;color:#fff;background:#0008;border:1px solid #ffffff2a;border-radius:999px;padding:5px 12px}
.primary{position:relative;z-index:2;margin:-46px 16px 0;display:flex;align-items:center;gap:14px;background:var(--accent);color:var(--acc-ink);border-radius:22px;padding:16px 18px;box-shadow:0 16px 36px #000a;flex:none;text-align:start}
.primary .ic{width:50px;height:50px;border-radius:14px;background:#ffffff40;display:flex;align-items:center;justify-content:center;flex:none}
.primary .t{flex:1}.primary .t b{display:block;font-size:21px}.primary .t span{font-size:13px;color:#140a22aa}
.status{margin:10px 16px 0;border-radius:16px;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:700;flex:none;font-size:15px;line-height:1.5}
.status small{display:block;font-weight:400;font-size:13px;opacity:.85}
.status.ok{background:rgba(46,160,90,.18);border:1px solid rgba(90,210,140,.5);color:#bff3d2}
.status.go{background:rgba(233,199,123,.16);border:1px solid rgba(233,199,123,.7);color:#fbeecb}
.status.bad{background:rgba(212,58,53,.16);border:1px solid rgba(240,110,105,.5);color:#ffd0cb}
.status.wait{background:#ffffff12;border:1px solid #ffffff2a;color:#fff}
.rows{padding:10px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:none}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;width:100%;text-decoration:none;color:inherit;text-align:start}
.row .ic{width:42px;height:42px;border-radius:12px;background:#b88cf21f;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.row b{font-size:15.5px;line-height:1.3}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#ffffff55 0,#ffffff1c 45%,transparent 70%);transform:translate(-50%,-50%)}
/* ترحيب أول مرة */
.welcome{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse 90% 60% at 50% 42%,#4a1a7a,#2a0e4a 45%,#120720 82%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;cursor:pointer}
.welcome .ln{font-weight:700;color:#fff;line-height:1.5;padding:4px 10px}
.welcome .l1{font-size:40px}.welcome .l2{font-size:26px}
.welcome .seatb{width:110px;height:110px;border-radius:30px;background:linear-gradient(#b88cf2,#7c3aed);color:#140a22;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 34px #7c3aed88;opacity:0}
.welcome .seatb small{font-size:14px;font-weight:700}.welcome .seatb b{font-size:52px;line-height:1}
.welcome .skip{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:12px;color:#ffffff66}
/* الأوراق */
.dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:9;background:#130d1b;border-radius:26px 26px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;transform:translateY(105%);max-height:92%}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;flex:none}
.sheet .hd b{flex:1;font-size:20px}.sheet .hd small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.x{width:38px;height:38px;border-radius:50%;background:#ffffff14;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
.mbody{flex:1;display:flex;min-height:0}
.rail{width:84px;flex:none;overflow-y:auto;border-inline-start:1px solid #ffffff12;padding:4px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:8px 2px;border-radius:16px;font-size:11.5px;text-align:center;line-height:1.3;color:var(--muted)}
.rail button.on{background:#b88cf22e;color:var(--ink)}
.rail img,.rail i{width:46px;height:46px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;background:#1d1429}
.list{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:8px}
.list::-webkit-scrollbar{display:none}
.banner{position:relative;margin:4px 12px 12px;height:104px;border-radius:20px;overflow:hidden;background:#2a0e4a}
.banner img{width:100%;height:100%;object-fit:cover}
.banner div{position:absolute;inset:0;background:linear-gradient(transparent,#000c);display:flex;align-items:flex-end;padding:12px;font-weight:700;font-size:19px}
.it{display:flex;align-items:center;gap:10px;margin:0 12px;padding:10px 0;border-bottom:1px solid #ffffff10}
.it img,.it i{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;background:#1d1429;display:block}
.it span{flex:1;font-size:15px}.it b{color:var(--gold);white-space:nowrap}
.it small{display:block;color:#cdbbe6;font-size:12px}
.it.off img{filter:grayscale(1) brightness(.6)} .it.off b{color:#ffb0a8;font-size:13px}
.sfoot{flex:none;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.go{width:100%;border-radius:18px;padding:15px;background:var(--accent);color:var(--acc-ink);font-weight:700;font-size:17px;text-align:center}
/* الفاتورة: تذكرة تنطبع */
.bp{position:fixed;inset:0;z-index:20;max-width:520px;margin:0 auto}
.bp .bd{position:absolute;inset:0;background:#05020a;opacity:0}
.bp .clip{position:absolute;left:0;right:0;top:0;bottom:64px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-top:calc(60px + env(safe-area-inset-top,0px))}
.bp .slot{position:absolute;left:22px;right:22px;bottom:46px;height:20px;border-radius:10px;background:linear-gradient(#2a1d3a,#0d0814);box-shadow:inset 0 3px 6px #000,0 0 22px #b88cf266;z-index:2}
.bp .slot::after{content:"";position:absolute;left:16px;right:16px;top:8px;height:4px;border-radius:2px;background:#000}
.bp .led{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12.5px;color:#c9a8ff}
.bp .rc{width:86%;max-height:100%;overflow-y:auto;scrollbar-width:none;transform:translateY(105%)}
.bp .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:14px;background:#ffffff1c;color:#fff;z-index:3}
.tk{background:#fff;color:#2a0e4a;border-radius:20px 20px 0 0;overflow:hidden}
.tk .top{background:linear-gradient(135deg,#8b5cf6,#4a1a7a);padding:16px 18px 14px;display:flex;align-items:center;gap:12px;color:#fff}
.tk .top .lg{width:84px;aspect-ratio:619/513;background:url(logo-white.png) center/contain no-repeat;flex:none}
.tk .top .sn{flex:1;text-align:end}.tk .top small{display:block;opacity:.8;font-size:12px}.tk .top b{font-size:34px;line-height:1}
.tk .rw{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14.5px;border-bottom:1px solid #efe7fa}
.tk .rw:last-child{border:0}
.cut{position:relative;height:22px;background:#fff}
.cut i{position:absolute;top:0;width:22px;height:22px;border-radius:50%;background:#05020a}
.cut i:first-child{right:-11px}.cut i:nth-child(2){left:-11px}
.cut em{position:absolute;left:18px;right:18px;top:10px;border-top:2px dashed #d9c7f5}
.tk2{background:#fff;color:#2a0e4a;padding:4px 18px 18px;border-radius:0 0 20px 20px}
.tk2 .tot{display:flex;justify-content:space-between;font-size:22px;font-weight:700}
.tk2 .tot span:last-child{color:#7c3aed}
.tk2 small{display:flex;justify-content:space-between;font-size:12px;color:#7b6a91}
.tk2 button{margin-top:12px;width:100%;border-radius:14px;padding:13px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-weight:700;text-align:center}
.sar{display:inline-block;width:.82em;height:.88em;fill:currentColor;vertical-align:-.07em;margin-inline-start:.16em}
html[dir=ltr] .row,html[dir=ltr] .primary{text-align:left}
/* الطلب من الجوال */
.ch2{display:flex;flex-direction:column;gap:12px;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.cbig{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:138px;border-radius:24px;padding:18px;text-align:start;width:100%}
.cbig .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.cbig b{display:block;font-size:24px}.cbig span.s{font-size:14.5px;opacity:.8}
.cbig.m{background:var(--accent);color:var(--acc-ink)}.cbig.m .ic{background:#ffffff4d}
.cbig.c{background:#221a2e;border:1.5px solid #3a2e4c}.cbig.c .ic{background:#2e2340;color:var(--accent)}
.lnk{display:block;width:100%;text-align:center;color:var(--muted);padding:10px;font-size:15px}
.oi{display:flex;align-items:center;gap:10px;margin:0 12px;padding:9px 0;border-bottom:1px solid #ffffff10}
.oi img,.oi i{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;background:#1d1429;display:block}
.oi span{flex:1;font-size:15px}.oi span small{display:block;color:var(--gold);font-weight:700;font-size:13px}
.oi.off{opacity:.45}
.plus{width:40px;height:40px;border-radius:50%;background:#2e2340;color:var(--accent);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.plus.has{background:var(--accent);color:var(--acc-ink);font-size:16px}
.obody{flex:1;display:flex;flex-direction:column;min-height:0}
.ochips{display:flex;gap:10px;padding:2px 12px 12px;overflow-x:auto;scrollbar-width:none;flex:none}.ochips::-webkit-scrollbar{display:none}
.ochips button{flex:none;display:flex;align-items:center;gap:10px;padding:6px;padding-inline-end:16px;border-radius:30px;background:#241b30;color:var(--ink);font-size:16px;font-weight:700;white-space:nowrap}
.ochips button.on{background:var(--accent);color:var(--acc-ink)}
.ochips img,.ochips i{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#1d1429;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;flex:none}
.otiles{flex:1;overflow-y:auto;scrollbar-width:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 12px 10px;align-content:start;grid-auto-rows:max-content}.otiles::-webkit-scrollbar{display:none}
.ot{position:relative;border-radius:16px;overflow:hidden;background:#17121f;text-align:start;display:flex;flex-direction:column;color:var(--ink);padding:0;align-items:stretch}
.ot img,.ot>i{width:100%;aspect-ratio:1/.92;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:30px;font-style:normal;background:#efe7da}
.ot span{padding:6px 8px 8px;font-size:13px;font-weight:700;line-height:1.35}.ot span small{display:block;color:var(--gold);font-weight:700;font-size:13px}
.osub.sep,.msub.sep{display:block;height:1px;margin:6px 2px;background:rgba(255,255,255,.14)}.osub,.msub{grid-column:1/-1;margin:8px 2px 0;font-size:14px;font-weight:800;color:var(--gold)}.osub:first-child,.msub:first-child{margin-top:0}.ot.has{outline:2.5px solid var(--accent);outline-offset:-2.5px}.ot.off{opacity:.45}
.ot em{position:absolute;top:6px;left:6px;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--acc-ink);font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.cartl .cq button.ced{width:auto;padding:0 10px;border-radius:14px;font-size:12.5px;color:var(--accent);font-weight:700}
.promo{position:relative;flex:1;min-height:0;margin:0 14px;border-radius:24px;overflow:hidden;background:#3b1270}
.promo video{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block;background:#3b1270}
.promo .pb{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.promo .pb small{background:#ffffffd9;color:#3b1270;font-size:13.5px;font-weight:700;padding:5px 12px;border-radius:14px}
.promo .pgo{width:100%;padding:16px;border-radius:18px;background:#3b1270;color:#fff;font-size:20px;font-weight:700;box-shadow:0 8px 24px #3b127066;display:flex;align-items:center;justify-content:center;gap:6px}
.promo .pgo .sar{fill:#fff}
.promo .pt{position:absolute;top:0;left:0;right:0;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;text-align:center}
.promo .pn{background:var(--gold);color:#2a1a00;font-size:13px;font-weight:700;padding:3px 12px;border-radius:12px}
.promo .pt b{font-size:46px;line-height:1.2}.promo .pp{color:var(--gold);font-size:28px;font-weight:800}.promo .pt small{font-size:14px;opacity:.9}
.stepr{display:flex;align-items:center;background:var(--accent);border-radius:22px;padding:3px;flex:none}.stepr button{width:36px;height:36px;border-radius:50%;color:var(--acc-ink);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;background:transparent}.stepr b{min-width:20px;text-align:center;color:var(--acc-ink);font-size:17px}
.cartl .cq{display:flex;align-items:center;gap:6px;flex:none}.cartl .cq b{min-width:14px;text-align:center}.cartl .cq button{font-size:17px;font-weight:700}
.cartl{max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:8px;font-size:13.5px}
.cartl div{display:flex;align-items:center;gap:8px;background:#ffffff0d;border-radius:12px;padding:6px 10px}
.cartl div span{flex:1}.cartl div button{width:28px;height:28px;border-radius:50%;background:#ffffff14;display:flex;align-items:center;justify-content:center;font-size:12px}
.sendb{display:flex;align-items:center;gap:12px;width:100%;border-radius:18px;padding:14px 16px;background:var(--accent);color:var(--acc-ink);font-weight:700;font-size:17px}
.sendb .n{width:30px;height:30px;border-radius:50%;background:var(--acc-ink);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px}
.sendb .t{flex:1;text-align:start}
.hint2{display:block;text-align:center;font-size:12.5px;color:var(--muted);margin-top:6px}
.opth{padding:0 16px;overflow-y:auto;flex:1}
.opth img{width:100%;height:150px;object-fit:cover;border-radius:18px;background:#fff;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.cmta{width:100%;box-sizing:border-box;height:96px;resize:none;border-radius:14px;border:1.5px solid rgba(255,255,255,.16);background:rgba(0,0,0,.25);color:inherit;font:inherit;font-size:16px;padding:12px;margin:4px 0 12px}.cmgo{display:block;width:100%;border:0;border-radius:16px;padding:15px;background:#e9c77b;color:#1a0d2e;font:inherit;font-size:17px;font-weight:800;margin-bottom:6px}.qdrow{flex-basis:100%;display:flex;justify-content:space-between;align-items:center;border:1.5px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 12px;font-weight:700}.qdrow.on{border-color:#62d498}.qdst{display:flex;align-items:center;gap:12px}.qdst button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:inherit;font-size:20px;border:0}.qdst button:disabled{opacity:.35}.qdst b{min-width:18px;text-align:center;font-size:18px}.qdwarn{background:#e9c77b;color:#1a0d2e;border-radius:16px;padding:14px;text-align:center;font-size:19px;font-weight:800;margin:6px 0 12px}.qdwarn small{display:block;font-size:13px;font-weight:600}.qdok{text-align:center;color:#62d498;font-weight:700;margin:6px 0 12px}.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.1);font-size:15px}.mst{font-size:13px;padding:4px 10px;border-radius:99px;white-space:nowrap;font-weight:700}.mst.w{background:#b88cf233;color:#c9a8ff}.mst.p{background:#e9c77b33;color:#e9c77b}.mst.d{background:#62d49833;color:#62d498}.mine{padding:4px 16px 20px;overflow-y:auto}.mempty{text-align:center;opacity:.7;padding:30px 0}.ogh{flex-basis:100%;font-size:13px;color:var(--muted);margin-top:4px}
.chip{border:1.5px solid #3a2e4c;border-radius:999px;padding:8px 14px;font-size:15px;min-height:42px}
.chip.on{background:var(--accent);color:var(--acc-ink);border-color:var(--accent);font-weight:700}
.qrow{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.qrow button{width:44px;height:44px;border-radius:50%;background:#2e2340;font-size:22px;display:flex;align-items:center;justify-content:center}
.qrow b{font-size:22px;min-width:24px;text-align:center}
.ninp{width:100%;background:#ffffff0d;border:1px solid #3a2e4c;border-radius:14px;padding:12px;color:var(--ink);font:inherit;font-size:15px}

function say(t){ try{ if(!(g?(g.cfg||{}).voice:mcfg.voice)||!("speechSynthesis" in window)) return; const u=new SpeechSynthesisUtterance(t); u.lang="ar-SA"; const v=speechSynthesis.getVoices().find(x=>/^ar/i.test(x.lang)); if(v) u.voice=v; u.rate=.95; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
function narrate(){ if(!isHost()||GT()!=="mafia"||!g||!g.d) return; const d=g.d, k=g.st+":"+g.ph+":"+(d.n||0); if(k===spoke) return; spoke=k; const rev=(g.cfg||{}).rev;
  if(g.st==="end") return say(d.win==="mafia"?"انتهت اللعبة. فازت المافيا!":"انتهت اللعبة. فاز أهل البلد!");

function mount(){ if(el) return; el=document.createElement("div"); el.id="gm"; el.className="gm"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","ألعاب الجلسة"); document.body.appendChild(el);

  clearInterval(tick); tick=setInterval(()=>{ if(!g||el.hidden) return; const now=Date.now();
    el.querySelectorAll("[data-end]").forEach(t=>{ const ms=+t.dataset.end-now; t.textContent=t.dataset.fmt==="s"?(ms>0?an(Math.ceil(ms/1000)):"خلص!"):mmss(ms); if(t.dataset.fmt==="s") t.classList.toggle("gz",ms<=0); });
    if(isHost()&&g.st==="play") host();
    if(GT()==="insp"&&g.st==="play"&&g.d&&g.d.ph==="neg"&&now>g.d.t0+g.d.tl+800&&now-(ui.itk||0)>4000){ ui.itk=now; iTx(()=>{},true); } },250); }

async function create(){ if(busy) return; const k=ui.gt||"brra", on=CATS.filter((_,i)=>!off.has(i)); if(k==="brra"&&on.length<3) return msg("خلّ ٣ فئات على الأقل");

  try{ await ref().set(doc); setMyP([pid]); lsSet("kz-g-"+K,gid); lsSet("kz-gname",n); ui={v:"wait"}; listen(); }
  catch(e){ gid=""; msg("ما قدرنا نبدأ اللعبة. تأكد إن الجلسة مفتوحة."); }
  busy=false; }
async function addPlayer(n){ n=String(n||"").trim().slice(0,16); if(!n) return msg("اكتب الاسم");
  if(pls().some(p=>p.n===n)) return msg("الاسم موجود، اكتب اسم ثاني"); const MX=I().max||MAXP; if(pls().length>=MX) return msg("الحد "+an(MX)+" لاعبين");
  if(!g||g.st!=="lobby") return msg("اللعبة بدأت، انتظروا اللعبة الجاية");

/* ---------- برا السالفة ---------- */
function pickRound(r){ const on=(g.cats||CATS).filter(c=>WORDS[c]); const used=new Set(g.used||[]);
  let cat=rnd(on), pool=WORDS[cat].filter(w=>!used.has(w)); if(!pool.length){ cat=rnd(on); pool=WORDS[cat] }
  const w=rnd(pool), P=pls().map(p=>p.id), prev=g.out, cand=P.length>2?P.filter(x=>x!==prev):P, out=rnd(cand);
  const gop=shuf([w].concat(shuf(WORDS[cat].filter(x=>x!==w)).slice(0,GOPT-1)));
  return {st:"play",r,ph:"see",cat,w,out,gop,ord:shuf(P),qi:0,t0:0,seen:{},v:{},g:"",last:null,used:(g.used||[]).concat(w)}; }
function tally(){ const P=pls().map(p=>p.id), c={}; Object.values(g.v||{}).forEach(t=>{ c[t]=(c[t]||0)+1 });
  const mx=Math.max(0,...Object.values(c)), tops=Object.keys(c).filter(k=>c[k]===mx); return {c,caught:mx>0&&tops.length===1&&tops[0]===g.out,P}; }
async function finish(right){ const {c,caught,P}=tally(), pts={}; P.forEach(p=>pts[p]=0);
  if(!caught) pts[g.out]=2; else if(right) pts[g.out]=1;
  Object.entries(g.v||{}).forEach(([p,t])=>{ if(t===g.out&&p!==g.out) pts[p]=(pts[p]||0)+1 });
  const hs={...(g.hs||{}),[g.r]:pts}; await up({ph:"res",["hs."+g.r]:pts,sc:sumHs(hs),last:{caught,right:!!right,c}}); }

/* ---------- ٥ ثواني ---------- */
async function fiveTurn(r,qi,ord){ const C=await chLoad(); if(!C||!C.length){ msg("ما قدرنا نحمّل التحديات، جرّب مرة ثانية"); return null }
  const used=g.used||[]; let ids=C.map((_,i)=>i).filter(i=>!used.includes(i)); if(!ids.length) ids=C.map((_,i)=>i);
  const i=rnd(ids); return {st:"play",r,qi,ord,ph:"ready",d:{c:C[i][1],lv:C[i][0]},used:used.concat(i),a:{},v:{},t0:0,last:null}; }
const fAns=()=>(g.ord||[])[g.qi||0];
const fVoters=()=>pls().map(p=>p.id).filter(p=>p!==fAns());
async function fiveFinish(){ const ans=fAns(), vs=fVoters().map(p=>(g.v||{})[p]).filter(Boolean), y=vs.filter(x=>x==="y").length, no=vs.length-y, ok=y>=no; // التعادل للاعب
  const key="t"+g.r+"_"+g.qi, pts={[ans]:ok?1:0}, hs={...(g.hs||{}),[key]:pts}; await up({ph:"res",["hs."+key]:pts,sc:sumHs(hs),last:{ok,y,n:no}}); }
async function fiveNext(){ const ord=g.ord||[], P=g.pl||{}; let r=g.r, qi=g.qi;
  do{ qi++; if(qi>=ord.length){ qi=0; r++; } }while(r<=ROUNDS&&!P[ord[qi]]);
  if(r>ROUNDS) return up({st:"end"}); const t=await fiveTurn(r,qi,ord); if(t) await up(t); }

async function lieQ(r){ const Q=await qLoad(); if(!Q||!Q.length){ msg("ما قدرنا نحمّل الأسئلة، جرّب مرة ثانية"); return null }
  const used=g.used||[]; let ids=Q.map((_,i)=>i).filter(i=>!used.includes(i)); if(!ids.length) ids=Q.map((_,i)=>i);
  const i=rnd(ids); return {st:"play",r,ph:"q",d:{cat:Q[i][0],q:Q[i][1],ans:Q[i][2]},used:used.concat(i),a:{},t0:Date.now(),last:null}; }
const AD="٠١٢٣٤٥٦٧٨٩", PD="۰۱۲۳۴۵۶۷۸۹";

function insApply(d,p,x){ const I=d.ins, ph=d.ph, mer=p!==I, er=t=>{ throw new Error(t) };

async function startGame(){ if(busy||!isHost()) return; const P=pls(), t=GT(); if(P.length<I().min) return msg("تحتاجون "+an(I().min)+" لاعبين على الأقل");
  if(t==="lies"){ const a=P.filter(p=>team(p.id)==="A").length; if(!a||a===P.length) return msg("لازم كل فريق فيه لاعب واحد على الأقل"); }
  busy=true;
  try{ if(t==="brra") await up({...pickRound(1),sc:{},hs:{}});
    else if(t==="five"){ g.used=[]; const x=await fiveTurn(1,0,shuf(P.map(p=>p.id))); if(x) await up({...x,sc:{},hs:{}}); }
    else if(t==="lies"){ g.used=[]; const x=await lieQ(1); if(x) await up({...x,sc:{A:0,B:0},hs:{}}); }
    else if(t==="mafia"){ say("بدأت اللعبة."); await up({...mafiaDeal(),sc:{},hs:{}}); }
    else if(t==="insp"){ if(P.length>5) return msg("الحد ٥ لاعبين"); await up({...insDeal(),sc:{},hs:{}}); }
  }finally{ busy=false } }
async function nextRound(){ if(GT()==="insp") return iTx(d=>insNextD(d)); if(busy||!isHost()) return; busy=true; const t=GT();
  try{ if(t==="brra"){ if(g.r>=ROUNDS) await up({st:"end"}); else await up(pickRound(g.r+1)); }
    else if(t==="five") await fiveNext();
    else if(t==="lies"){ if(g.r>=QN) await up({st:"end"}); else { const x=await lieQ(g.r+1); if(x) await up(x); } }
    else if(t==="mafia"){ const d=g.d; if(g.ph==="day"){ if(d.win) await up({st:"end"}); else await up({ph:"talk",t0:Date.now()}); }
      else if(g.ph==="out"){ if(d.win) await up({st:"end"}); else await up({ph:"night",a:{},v:{},d:{...d,n:(d.n||1)+1,kill:"",saved:false,out:""}}); } }
  }finally{ busy=false } }
async function newGame(){ if(busy||!isHost()) return; busy=true; spoke=""; await up({st:"lobby",r:0,ph:"",sc:{},hs:{},seen:{},v:{},g:"",last:null,a:{},d:{},used:[]}); busy=false; }
let hostBusy=false;
async function host(){ if(!isHost()||!g||g.st!=="play"||hostBusy) return; const P=pls().map(p=>p.id), t=GT(), now=Date.now(); hostBusy=true;
  try{
    if(t==="brra"){
      if(g.ph==="see"&&P.every(p=>(g.seen||{})[p])) await up({ph:"ask",t0:now,qi:0});
      else if(g.ph==="ask"&&g.t0&&now>g.t0+ASK) await up({ph:"vote"});
      else if(g.ph==="vote"&&P.every(p=>(g.v||{})[p])){ const {caught}=tally(); if(caught) await up({ph:"guess"}); else await finish(false); }
      else if(g.ph==="guess"&&g.g) await finish(g.g===g.w);
    } else if(t==="five"){
      if(g.ph==="ready"&&(g.a||{})[fAns()]) await up({ph:"say",t0:now});
      else if(g.ph==="say"&&now>g.t0+FIVE+700) await up({ph:"vote"});
      else if(g.ph==="vote"){ const V=fVoters(); if(V.length&&V.every(p=>(g.v||{})[p])) await fiveFinish(); }
    } else if(t==="lies"){
      if(g.ph==="q"&&(((g.a||{}).A&&(g.a||{}).B)||now>g.t0+QT+800)) await lieJudge();
    } else if(t==="mafia"&&g.d){
      if(g.ph==="see"&&P.every(p=>(g.seen||{})[p])) await up({ph:"night",a:{}});
      else if(g.ph==="night"&&mAlive().every(p=>(g.a||{})[p])) await mafiaNight();
      else if(g.ph==="talk"&&now>g.t0+((g.cfg||{}).talk||180)*1000) await up({ph:"vote",v:{}});
      else if(g.ph==="vote"&&mAlive().every(p=>(g.v||{})[p])) await mafiaVote();
    }
  }finally{ hostBusy=false } }
async function skip(){ if(GT()==="insp") return iTx(d=>insSkipD(d)); if(!isHost()||busy) return; busy=true; const t=GT();
  try{ if(t==="brra"){
      if(g.ph==="see") await up({ph:"ask",t0:Date.now(),qi:0});
      else if(g.ph==="ask") await up({ph:"vote"});
      else if(g.ph==="vote"){ const {caught}=tally(); if(caught) await up({ph:"guess"}); else await finish(false); }
      else if(g.ph==="guess") await finish(false);
    } else if(t==="five"){ if(g.ph==="ready"){ busy=false; return fiveNext(); } if(g.ph==="say") await up({ph:"vote"}); else if(g.ph==="vote") await fiveFinish(); }
    else if(t==="lies"){ if(g.ph==="q") await lieJudge(); }
    else if(t==="mafia"){ if(g.ph==="see") await up({ph:"night",a:{}}); else if(g.ph==="night") await mafiaNight(); else if(g.ph==="talk") await up({ph:"vote",v:{}}); else if(g.ph==="vote") await mafiaVote(); }
  }finally{ busy=false } }

      const sub=r==="m"?(()=>{ const mt=Object.keys(ro).filter(x=>ro[x]==="m"&&x!==p.id&&al[x]); return mt.length?`<small class="gs">معك: ${names(mt)}${mt.map(x=>(g.a||{})[x]?" · "+esc(nm(x))+" اختار "+esc(nm(g.a[x])):"").join("")}</small>`:"" })():r==="c"?`<small class="gs">اختيارك ما يأثر. بس الكل لازم يضغط، عشان محد يعرف دورك من حركتك.</small>`:"";
      return `${mbg(MIMG.night)}${H("🌙 "+tag)}<div class="gmb mgm"><small class="gs" style="text-align:center">${esc(p.n)} · ${RI[r]} ${RN[r]}</small><h3 style="text-align:center">${q}</h3>${sub}${mTable(MIMG.night,{pick:opts,act:r==="s"?"mpick":"mact",pid:p.id,me:p.id})}<small class="gs" style="text-align:center">اضغط على اسم اللي تختاره</small></div>`; }
    const s=A.filter(p=>(g.a||{})[p]).length;
    return `${mbg(MIMG.night)}${H("🌙 "+tag)}<div class="gmb mgm">${ghost}<h3 style="text-align:center">الليل… الكل يختار بالسر</h3>${mTable(MIMG.night)}<small class="gs" style="text-align:center">اختار ${an(s)} من ${an(A.length)}</small>${isHost()?btn("كمّلوا بدونهم","skip","gl"):""}</div>`; }
  if(g.ph==="day"){ const k=d.kill, txt=k?`<small class="gs">انقتل الليلة</small><div class="gbig">${esc(nm(k))}</div>${rev?`<h3>كان ${RI[ro[k]]} ${RN[ro[k]]}</h3>`:""}`:d.saved?`<h3>المافيا حاولت تقتل…</h3><div class="gbig">💉 الطبيب أنقذه</div><small class="gs">ما مات أحد الليلة</small>`:`<h3>ليلة هادية</h3><small class="gs">ما مات أحد</small>`;
    return `${mbg(MIMG.day)}${H("☀️ طلع الصبح")}<div class="gmb mgm">${mTable(MIMG.day)}<div class="mtx">${txt}</div>${ghost}${d.win?`<h3 class="gold" style="text-align:center">انتهت اللعبة!</h3>`:""}${isHost()?btn(d.win?"النتيجة":"ابدأ النقاش 🗣","next"):waitHost()}</div>`; }
  if(g.ph==="talk"){ const end=g.t0+((g.cfg||{}).talk||180)*1000;
    return `${mbg(MIMG.day)}${H("🗣 النقاش")}<div class="gmb mgm"><div class="gbig" style="text-align:center" data-end="${end}">${mmss(end-Date.now())}</div><h3 style="text-align:center">مين المافيا؟ ناقشوا</h3>${mTable(MIMG.day)}${ghost}${isHost()?btn("نصوّت الحين","skip"):`<small class="gs" style="text-align:center">التصويت يبدأ لما يخلص الوقت</small>`}</div>`; }
  if(g.ph==="vote"){ const P=pending("v",A);
    if(P.length){ const p=P[0]; return `${mbg(MIMG.day)}${H("🗳 التصويت")}<div class="gmb mgm"><h3 style="text-align:center">${esc(p.n)}، مين تطلّعون؟</h3>${mTable(MIMG.day,{pick:A.filter(x=>x!==p.id),act:"mvote",pid:p.id,me:p.id})}<small class="gs" style="text-align:center">اضغط على اسم اللي تصوّت عليه</small>${btn("ما أصوت على أحد","mvote","gl",p.id+":-")}</div>`; }
    const s=A.filter(p=>(g.v||{})[p]).length;
    return `${mbg(MIMG.day)}${H("🗳 التصويت")}<div class="gmb mgm">${ghost}<h3 style="text-align:center">ننتظر الباقين يصوتون</h3>${mTable(MIMG.day)}<small class="gs" style="text-align:center">صوّت ${an(s)} من ${an(A.length)} · ${names(A.filter(p=>!(g.v||{})[p]))}</small>${isHost()?btn("كمّلوا بدونهم","skip","gl"):""}</div>`; }
  const o=d.out, vc=d.vc||{};
  const votes=Object.keys(vc).sort((a,b)=>vc[b]-vc[a]).map(k=>(k==="-"?"ما أحد":esc(nm(k)))+" "+an(vc[k])).join("، ");
  return `${mbg(MIMG.day)}${H("🗳 نتيجة التصويت")}<div class="gmb mgm">${mTable(MIMG.day,{cnt:Object.fromEntries(Object.entries(vc).filter(([k])=>k!=="-"))})}<div class="mtx">${o?`<small class="gs">طلع</small><div class="gbig">${esc(nm(o))}</div>${rev?`<h3>كان ${RI[ro[o]]} ${RN[ro[o]]}</h3>`:""}`:`<h3>ما اتفقتوا</h3><small class="gs">محد طلع هالمرة</small>`}<small class="gs">الأصوات: ${votes||"ما أحد صوّت"}</small></div>${ghost}${d.win?`<h3 class="gold" style="text-align:center">انتهت اللعبة!</h3>`:""}${isHost()?btn(d.win?"النتيجة":"الليل الجاي 🌙","next"):waitHost()}</div>`; }

function vEnd(){ if(GT()==="insp") return vIEnd(); const t=GT(), again=(isHost()?btn("لعبة جديدة","again","gl"):"")+(joinOnly?"":btn("ألعاب ثانية","fresh","gl"));
  if(t==="lies"){ const sc=g.sc||{}, a=sc.A||0, b=sc.B||0, W=a===b?"تعادل!":TN[a>b?"A":"B"];
    return `${head("خلصت اللعبة")}<div class="gmb"><div class="gcard" style="text-align:center"><small class="gs">${a===b?"النتيجة":"الفريق الفايز"}</small><div class="gbig">${W}</div></div>
    <div class="gteams">${["A","B"].map(T=>`<div class="t${T}"><small>${TN[T]}</small><b>${an(sc[T]||0)}</b><i>${names(pls().filter(p=>team(p.id)===T))}</i></div>`).join("")}</div>${again}</div>`; }
  if(t==="mafia"){ const d=g.d||{}, ro=d.ro||{}, al=d.al||{}, m=d.win==="mafia";
    return `${head("خلصت اللعبة")}<div class="gmb"><div class="gcard" style="text-align:center"><div class="grole">${m?"🔪":"🙂"}</div><div class="gbig">${m?"فازت المافيا":"فاز أهل البلد"}</div></div>
    <div class="gcard gpl">${pls().map(p=>`<div class="gpr"><span>${esc(p.n)}${al[p.id]?"":" <i>· طلع</i>"}</span><b>${RI[ro[p.id]]||""} ${RN[ro[p.id]]||""}</b></div>`).join("")}</div>${again}</div>`; }
  const P=pls().map(p=>({...p,s:(g.sc||{})[p.id]||0})).sort((a,b)=>b.s-a.s), top=P[0]?P[0].s:0, W=P.filter(p=>p.s===top).map(p=>esc(p.n)).join(" و");
  return `${head("خلصت اللعبة")}<div class="gmb"><div class="gcard" style="text-align:center"><small class="gs">الفايز</small><div class="gbig">🏆 ${W}</div></div>${board()}${again}</div>`; }
function paint(force){ if(!el||el.hidden) return; if(!force&&ui.mlock&&Date.now()<ui.mlock) return; const ae=document.activeElement; if(!force&&ae&&ae.tagName==="INPUT"&&el.contains(ae)) return; let h="";
  if(ui.v==="gone"||(gid&&!g&&ui.v!=="wait")) h=`${head("ألعاب الجلسة")}${center(`<h3>اللعبة انتهت</h3><small class="gs">الباركود قديم أو الجلسة انقفلت.</small>${joinOnly?"":btn("ابدأ لعبة جديدة","fresh")}`)}`;
  else if(!gid) h=ui.v==="set"?vSet():ui.v==="iov"?vIOv():vPick();
  else if(!g) h=center(`<small class="gs">لحظة…</small>`);
  else if(ui.v==="add") h=vAdd();
  else if(g.st==="lobby") h=vLobby();
  else if(!local().length) h=vJoin();
  else if(g.st==="end") h=vEnd();
  else { const t=GT(); h=t==="five"?vFive():t==="lies"?vLies():t==="mafia"?vMafia():t==="insp"?vInsp():vBrra(); }
  const keep={}, sk={}; el.querySelectorAll("input[id]").forEach(i=>keep[i.id]=i.value); el.querySelectorAll("[data-sk]").forEach(e=>sk[e.dataset.sk]=e.scrollLeft);
  el.innerHTML=`<div class="gmw g-${gid?GT():"hub"}">${h}</div>`; Object.entries(keep).forEach(([id,v])=>{ const i=el.querySelector("#"+id); if(i&&v!=null) i.value=v; }); Object.entries(sk).forEach(([k,v])=>{ const e=el.querySelector(`[data-sk="${k}"]`); if(e) e.scrollLeft=v; }); try{ iMaybeIntro() }catch(e){} try{ iCarInit() }catch(e){} try{ iRevCheck() }catch(e){} try{ mAnim() }catch(e){} try{ iResAnim() }catch(e){} }
async function onClick(e){ const b=e.target.closest("[data-g]"); if(!b) return; const a=b.dataset.g, x=b.dataset.x; ui.err=""; const ae=document.activeElement; if(ae&&ae.tagName==="INPUT"&&el.contains(ae)&&a!=="lans") ae.blur();
  if(a==="close") return hide();
  if(a==="hf"){ ui.hf=x; return paint(); } if(a==="set"){ ui.v=x==="insp"?"iov":"set"; ui.gt=x; return paint(); } if(a==="iovgo"){ ui.v="set"; return paint(); } if(a==="pick"){ ui.v="pick"; return paint(); }
  if(a==="cat"){ const i=+x; off.has(i)?off.delete(i):off.add(i); return paint(); }
  if(a==="allcats"){ off.clear(); return paint(); }
  if(a==="mcfg"){ mcfg[x]=!mcfg[x]; return paint(); } if(a==="talk"){ mcfg.talk=+x; return paint(); }
  if(a==="icf"){ const [k2,v]=x.split(":"); icfg[k2]=+v; return paint(); } if(a==="iav"){ ui.av=x; return paint(true); }
  if(a[0]==="i"&&g&&GT()==="insp"&&g.st==="play") return iClick(a,x);
  if(a==="create") return create();
  if(a==="add"){ ui.v="add"; return paint(); } if(a==="back"){ ui.v=""; return paint(); }
  if(a==="addok") return addPlayer((el.querySelector("#gma")||{}).value);
  if(a==="join") return addPlayer((el.querySelector("#gmj")||{}).value);
  if(a==="kick"){ if(isHost()) await up({["pl."+x]:FV().delete(),...(GT()==="lies"?{["tm."+x]:FV().delete()}:{})}); return; }
  if(a==="swap"){ if(g.st!=="lobby") return; return up({["tm."+x]:team(x)==="A"?"B":"A"}); }
  if(a==="start") return startGame();
  if(a==="rev"){ ui.rev=x; return paint(); }
  if(a==="seen"){ ui.rev=""; await up({["seen."+x]:1}); return; }
  if(a==="nextq") return up({qi:FV().increment(1)});
  if(a==="skip") return skip();
  if(a==="vote"){ const [p,t]=x.split(":"); ui.rev=""; return up({["v."+p]:t}); }
  if(a==="guess"){ if(busy) return; busy=true; await up({g:x}); busy=false; return; }
  if(a==="next") return nextRound();
  if(a==="again") return newGame();
  if(a==="fresh"){ gid=""; g=null; if(un){un();un=null} lsSet("kz-g-"+K,null); ui={v:"pick"}; return paint(); }
  // ٥ ثواني
  if(a==="fgo"){ if(g.ph!=="ready") return; ui.go={k:g.r+"_"+g.qi,t:Date.now()}; paint(true); return up({["a."+x]:Date.now()}); }
  if(a==="fv"){ const [p,t]=x.split(":"); return up({["v."+p]:t}); }
  // تسرق ولا تجاوب
  if(a==="lans"){ if(g.ph!=="q") return msg("خلص الوقت"); const i=el.querySelector("#gla"+x), t=String(i&&i.value||"").trim().slice(0,40); if(!t) return msg("اكتبوا جوابكم أول"); if(i) i.blur(); if((g.a||{})[x]) return; return up({["a."+x]:{t}}); }
  if(a==="lsc"){ ui.cf=x; return paint(true); } if(a==="lnost"){ ui.cf=""; return paint(true); }
  if(a==="lsteal"){ ui.cf=""; if(g.ph!=="q") return msg("خلص الوقت"); if((g.a||{})[x]) return; return up({["a."+x]:{s:1}}); }
  if(a==="ljd"){ const [T,v]=x.split(":"); ui.jd[T]=v==="1"; return paint(); }
  if(a==="ljok"){ if(!isHost()||busy) return; busy=true; try{ await lieFinish({...ui.jd}) }finally{ busy=false } return; }
  if(a==="ljedit"){ if(!isHost()) return; const ok=(g.last||{}).ok||{}; ui.jk=g.r; ui.jd={A:!!ok.A,B:!!ok.B}; return up({ph:"judge",last:{...(g.last||{}),m:{A:lMark("A")==="near"?"near":lMark("A"),B:lMark("B")==="near"?"near":lMark("B")}}}); }
  // المافيا
  if(a==="mact"){ const [p,t]=x.split(":"); ui.rev=""; return up({["a."+p]:t}); }
  if(a==="mpick"){ const [p,t]=x.split(":"); ui.det={p,t}; return paint(); }
  if(a==="mdet"){ const dt=ui.det; ui.det=null; ui.rev=""; if(dt) return up({["a."+dt.p]:dt.t}); return; }
  if(a==="mvote"){ const [p,t]=x.split(":"); return up({["v."+p]:t}); }
}
return {open,boot};
})();
